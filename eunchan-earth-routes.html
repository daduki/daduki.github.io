    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(620, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.18, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

    <script>
        // Great-Circle Spherical Interpolation (SLERP)
        function slerp(p0, p1, t) {
            const toRad = Math.PI / 180;
            const toDeg = 180 / Math.PI;
            const lon0 = p0[0] * toRad, lat0 = p0[1] * toRad;
            const lon1 = p1[0] * toRad, lat1 = p1[1] * toRad;

            const v0 = [Math.cos(lat0) * Math.cos(lon0), Math.cos(lat0) * Math.sin(lon0), Math.sin(lat0)];
            const v1 = [Math.cos(lat1) * Math.cos(lon1), Math.cos(lat1) * Math.sin(lon1), Math.sin(lat1)];

            let dot = v0[0]*v1[0] + v0[1]*v1[1] + v0[2]*v1[2];
            dot = Math.max(-1, Math.min(1, dot));
            const omega = Math.acos(dot);
            if (Math.abs(omega) < 1e-6) return p0;

            const sinOmega = Math.sin(omega);
            const s0 = Math.sin((1 - t) * omega) / sinOmega;
            const s1 = Math.sin(t * omega) / sinOmega;

            const x = s0 * v0[0] + s1 * v1[0];
            const y = s0 * v0[1] + s1 * v1[1];
            const z = s0 * v0[2] + s1 * v1[2];

            const lat = Math.atan2(z, Math.sqrt(x*x + y*y)) * toDeg;
            const lon = Math.atan2(y, x) * toDeg;
            return [lon, lat];
        }

        // Great-Circle distance in km
        function gcDistance(p0, p1) {
            const toRad = Math.PI / 180;
            const dLat = (p1[1] - p0[1]) * toRad;
            const dLon = (p1[0] - p0[0]) * toRad;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(p0[1] * toRad) * Math.cos(p1[1] * toRad) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(6371 * c);
        }

        // Normalize longitude to [-180, 180]
        function normLon(lon) {
            let l = lon % 360;
            if (l > 180) l -= 360;
            if (l < -180) l += 360;
            return l;
        }

        // Generate N points along great circle
        function generateGreatCirclePoints(p0, p1, steps = 80) {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                pts.push(slerp(p0, p1, i / steps));
            }
            return pts;
        }

        // Generate points for planar straight line across cylinder
        function getPlanarPoints(p0, p1, steps = 80) {
            let lon0 = p0[0], lat0 = p0[1];
            let lon1 = p1[0], lat1 = p1[1];
            let dLon = lon1 - lon0;
            if (dLon > 180) dLon -= 360;
            if (dLon < -180) dLon += 360;
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                let lon = normLon(lon0 + dLon * t);
                let lat = lat0 + (lat1 - lat0) * t;
                pts.push([lon, lat]);
            }
            return pts;
        }

        // Split coordinates across rotated antimeridian seam so lines never erratically cross screen
        function splitByRotatedAntimeridian(points, rotLon) {
            const segments = [];
            let current = [];
            for (let i = 0; i < points.length; i++) {
                const pt = points[i];
                const rotX = normLon(pt[0] + rotLon);
                if (current.length === 0) {
                    current.push(pt);
                } else {
                    const prev = current[current.length - 1];
                    const prevRotX = normLon(prev[0] + rotLon);
                    if (Math.abs(rotX - prevRotX) > 180) {
                        segments.push(current);
                        current = [pt];
                    } else {
                        current.push(pt);
                    }
                }
            }
            if (current.length > 0) segments.push(current);
            return segments;
        }

        // Split coordinates across static 180 antimeridian
        function splitAntimeridian(points) {
            return splitByRotatedAntimeridian(points, 0);
        }

            const height = canvas.height;
            const radius = Math.min(width, height) / 2 - 14;

            const initialRot = customRotation || [-route.centerLonLat[0], -route.centerLonLat[1], 0];
            let rotation = [...initialRot];

            const projection = d3.geoOrthographic()
                .scale(radius * 1.05)
                .translate([width / 2, height / 2])
                .rotate(rotation)
                .clipAngle(90);

            const path = d3.geoPath().projection(projection).context(ctx);
            const gcPoints = generateGreatCirclePoints(route.p0, route.p1, 80);

            function render(airplaneT = 0.5) {
                ctx.clearRect(0, 0, width, height);

                // Ocean background
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, radius, 0, 2 * Math.PI);
                const grad = ctx.createRadialGradient(width / 2 - radius * 0.3, height / 2 - radius * 0.3, radius * 0.1, width / 2, height / 2, radius);
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#080e1a');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#38bdf8';
                ctx.stroke();

                // Graticules
                ctx.beginPath();
                path(d3.geoGraticule10());
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.18)';
                ctx.stroke();

                // Continents
                worldFeatures.features.forEach(f => {
                    ctx.beginPath();
                    path(f);
                    ctx.fillStyle = '#334155';
                    ctx.fill();
                    ctx.lineWidth = 0.5;
                    ctx.strokeStyle = '#1e293b';
                    ctx.stroke();
                });

                // Flight Great Circle Line
                const lineGeo = { type: "LineString", coordinates: gcPoints };
                ctx.beginPath();
                path(lineGeo);
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#10b981'; // Glowing emerald flight path
                ctx.stroke();

                // Glowing Dash Line overlay
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                path(lineGeo);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#6ee7b7';
                ctx.stroke();
                ctx.setLineDash([]);

                // Start & End City Pins
                [route.p0, route.p1].forEach((pt, idx) => {
                    const projected = projection(pt);
                    if (projected && !isNaN(projected[0])) {
                        // Check if on visible hemisphere
                        const rot = projection.rotate();
                        const pRot = d3.geoRotation(rot)(pt);
                        if (pRot[0] >= -90 && pRot[0] <= 90) {
                            ctx.beginPath();
                            ctx.arc(projected[0], projected[1], 5.5, 0, 2 * Math.PI);
                            ctx.fillStyle = idx === 0 ? '#38bdf8' : '#f43f5e';
                            ctx.fill();
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = '#ffffff';
                            ctx.stroke();
                        }
                    }
                });

                // Moving Airplane along route
                const planePos = slerp(route.p0, route.p1, airplaneT);
                const planeProj = projection(planePos);
                if (planeProj && !isNaN(planeProj[0])) {
                    const rot = projection.rotate();
                    const pRot = d3.geoRotation(rot)(planePos);
                    if (pRot[0] >= -90 && pRot[0] <= 90) {
                        ctx.font = '16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('✈️', planeProj[0], planeProj[1]);

                // Atmosphere rim shadow
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, radius, 0, 2 * Math.PI);
                const rimGrad = ctx.createRadialGradient(width / 2, height / 2, radius * 0.75, width / 2, height / 2, radius);

                rimGrad.addColorStop(1, 'rgba(0,0,0,0.55)');

            let lastPos = [0, 0];
            function onDown(e) {
                dragging = true;
                isInteractingWithMap = true;
                touchStartedOnInteractive = true;

                lastPos = [e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY)];
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
            }
            function onMove(e) {
                if (!dragging) return;
                isInteractingWithMap = true;
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                const dx = x - lastPos[0];
                const dy = y - lastPos[1];
                lastPos = [x, y];

                render();
                if (e.cancelable) e.preventDefault();
            }
            function onUp() {
                dragging = false;
                canvas.style.cursor = 'grab';
                setTimeout(() => { isInteractingWithMap = false; }, 120);
            }

            if (!canvas._hasGlobeDragListeners) {
                canvas._hasGlobeDragListeners = true;
                canvas.addEventListener('mousedown', onDown);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);

                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onUp);

        let isInteractingWithMap = false;

        // Draw 2D Mercator Map Comparing Flat Line vs True Great Circle
        // Features real-time horizontal drag-to-pan & seamless continuous line rendering
        function drawFlightMercator(canvas, route, customRot = null) {
            if (!worldFeatures) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            if (customRot !== null) {
                canvas._rotLon = customRot;
            } else if (canvas._rotLon === undefined) {
                // Optimal initial centering for each route so it is unified
                if (route.id === 'icn_jfk') canvas._rotLon = -160; // Pacific center (Incheon to NY continuous)
                else if (route.id === 'jfk_lhr') canvas._rotLon = 30; // Atlantic center (NY to London continuous)
                else if (route.id === 'scl_syd') canvas._rotLon = 140; // South Pacific center (Santiago to Sydney continuous)
                else canvas._rotLon = -160;
            }

            const projection = d3.geoMercator()
                .scale(width / (2 * Math.PI) * 0.95)
                .translate([width / 2, height / 2 + 18])
                .rotate([canvas._rotLon, 0]);

            ctx.beginPath();
            path(d3.geoGraticule10());
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
            ctx.stroke();

            // Equator (Full 360 circle)
            const equator = d3.geoCircle().center([0, 90]).radius(90)();
            ctx.beginPath();
            path(equator);
            ctx.lineWidth = 0.8;
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.35)';
            ctx.stroke();

            // Continents

                ctx.beginPath();
                path(f);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = '#334155';
                ctx.stroke();

            // 1. Fake Planar Line (주황색 점선 - 평면 지도의 착각 속 직선)

            const planarSegments = splitByRotatedAntimeridian(planarPoints, canvas._rotLon);
            planarSegments.forEach(seg => {
                ctx.beginPath();
                seg.forEach((pt, i) => {
                    const proj = projection(pt);
                    if (proj) {
                        if (i === 0) ctx.moveTo(proj[0], proj[1]);
                        else ctx.lineTo(proj[0], proj[1]);
                    }
                });
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#f59e0b'; // Amber dashed
                ctx.stroke();
                ctx.setLineDash([]);

            // 2. True Great Circle (초록색 실선 - 실제 둥근 지구 최단 대권항로)
            const gcPoints = generateGreatCirclePoints(route.p0, route.p1, 100);
            const gcSegments = splitByRotatedAntimeridian(gcPoints, canvas._rotLon);
            gcSegments.forEach(seg => {
                ctx.beginPath();
                seg.forEach((pt, i) => {
                    const proj = projection(pt);
                    if (proj) {
                        if (i === 0) ctx.moveTo(proj[0], proj[1]);
                        else ctx.lineTo(proj[0], proj[1]);
                    }
                });
                ctx.lineWidth = 3.2;
                ctx.strokeStyle = '#10b981'; // Emerald solid
                ctx.stroke();
            });

            // City Pins & Name Tags
            [
                { pt: route.p0, name: route.name0.split(' ')[0], color: '#38bdf8' },
                { pt: route.p1, name: route.name1.split(' ')[0], color: '#f43f5e' }
            ].forEach(item => {
                const projected = projection(item.pt);
                if (projected && projected[0] >= -10 && projected[0] <= width + 10) {
                    ctx.beginPath();
                    ctx.arc(projected[0], projected[1], 4.5, 0, 2 * Math.PI);
                    ctx.fillStyle = item.color;
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(item.name, projected[0] + 6, projected[1] - 4);
                    ctx.shadowBlur = 0;
                }

            // Real-time status indicator on canvas
            ctx.save();
            ctx.font = 'bold 10px sans-serif';
            if (gcSegments.length === 1) {
                ctx.fillStyle = 'rgba(16, 185, 129, 0.95)';
                ctx.fillText('🟢 경로가 하나의 선으로 연결됨', 8, 16);

            if (!canvas._hasMercatorDragListeners) {
                canvas._hasMercatorDragListeners = true;
                canvas.style.touchAction = 'none';
                canvas.style.cursor = 'grab';
                let mDragging = false;

                function onMDown(e) {
                    mDragging = true;
                    isInteractingWithMap = true;
                    touchStartedOnInteractive = true;
                    canvas.style.cursor = 'grabbing';
                    startX = e.clientX || (e.touches && e.touches[0].clientX);
                    if (e.cancelable) e.preventDefault();

                function onMMove(e) {
                    if (!mDragging) return;
                    isInteractingWithMap = true;
                    const x = e.clientX || (e.touches && e.touches[0].clientX);

                    startX = x;
                    canvas._rotLon = normLon(canvas._rotLon + dx * 0.45);
                    drawFlightMercator(canvas, route);
                    if (e.cancelable) e.preventDefault();
                }

                function onMUp() {
                    mDragging = false;
                    canvas.style.cursor = 'grab';
                    setTimeout(() => { isInteractingWithMap = false; }, 120);
                }

                canvas.addEventListener('mousedown', onMDown);
                window.addEventListener('mousemove', onMMove);
                window.addEventListener('mouseup', onMUp);
                canvas.addEventListener('touchstart', onMDown, { passive: false });
                window.addEventListener('touchmove', onMMove, { passive: false });
                window.addEventListener('touchend', onMUp);
            }
        }

            if (!('speechSynthesis' in window)) {

                return;
            }
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-sky-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[⭕❌✨💡🚨🤔👉🔴🌟🎖️🏆🚀🍊🗺️🔍📏🌐❓🇩🇿🇰🇿🇦🇷🇮🇳🇦🇺🇧🇷🇺🇸🇨🇳🇨🇦🇷🇺🇬🇱✈️🛫🧭🧶⏱️🐧❄️🍉📍]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-sky-400', 'animate-pulse');

                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

                card.addEventListener('touchend', e => {
                    touchEndX = e.changedTouches[0].screenX;
                    handleSwipe();
                }, {passive: true});
                
                function handleSwipe() {
                    const threshold = 50;
                    if (touchEndX < touchStartX - threshold) {
                        if (typeof nextSlide === 'function') nextSlide();
                    }
                    if (touchEndX > touchStartX + threshold) {
                        if (typeof prevSlide === 'function') prevSlide();
                    }
                }
            }
        });
    </script>
</body>
</html>
