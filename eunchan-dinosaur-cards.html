    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'roar') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.linearRampToValueAtTime(75, now + 0.5);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

        function updateProgress() {
            document.getElementById('slideIndicator').textContent = currentSlide;
            const pct = (currentSlide / totalSlides) * 100;
            document.getElementById('topProgressBar').style.width = pct + '%';
            document.getElementById('prevBtn').disabled = (currentSlide === 1);
            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);

            const dotsCont = document.getElementById('dotsContainer');
            dotsCont.innerHTML = '';
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all flex-shrink-0 ${i === currentSlide ? 'w-5 bg-emerald-400' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(i);
                dotsCont.appendChild(dot);
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                playSound('pop');
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                playSound('pop');
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(n) {
            playSound('pop');
            currentSlide = n;
            renderSlide();
            const drawer = document.getElementById('indexDrawer');
            if (!drawer.classList.contains('hidden')) drawer.classList.add('hidden');
        }

                    btn.onclick = () => goToSlide(idx + 1);
                    list.appendChild(btn);
                });
            }

                                    <strong class="text-sky-300 font-kids text-sm block">🌊 경남 고성 덕명리 공룡 발자국</strong>
                                    <p>세계 3대 공룡 발자국 화석지 중 하나로, 거대한 초식공룡과 익룡들이 해안가를 쿵쿵 걸어간 수천 개의 발자국이 선명하게 남아 있어요!</p>
                                </div>
                                <div class="p-3.5 bg-emerald-950/40 rounded-2xl border border-emerald-500/30 space-y-1">
                                    <strong class="text-emerald-300 font-kids text-sm block">🥚 전남 해남 우항리 화석지</strong>
                                    <p>공룡 발자국과 함께 익룡 발자국, 새 발자국이 한 갯벌 층에서 세계 최초로 동시에 발견된 세계적인 유적지랍니다!</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentSlide >= 19 && currentSlide <= 23) {
                // Quiz
                const qIdx = currentSlide - 19;
                const q = QUIZ_QUESTIONS[qIdx];
                const selected = quizAnswers[qIdx];
                body.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-emerald-400 font-kids">🎯 공룡 탐험 퀴즈 (${qIdx + 1} / 5)</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-kids">점수: ${Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length * 20}점</span>
                        </div>
                        <h3 class="font-kids text-xl md:text-2xl text-white mb-4 leading-snug">
                            Q${qIdx + 1}. ${q.q}
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${q.options.map((opt, optIdx) => {
                                let style = "bg-slate-800/90 border-slate-700 hover:bg-slate-700 text-slate-200";
                                if (selected !== undefined) {
                                    if (optIdx === q.ans) style = "bg-emerald-600/90 border-emerald-400 text-white font-bold ring-2 ring-emerald-400";
                                    else if (optIdx === selected) style = "bg-rose-600/90 border-rose-400 text-white font-bold";
                                }
                                return `
                                    <button onclick="handleQuizAnswer(${qIdx}, ${optIdx})" class="p-4 rounded-2xl border text-left font-kids text-sm transition ${style}">
                                        ${optIdx + 1}. ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-xs text-slate-400 font-kids">
                            💡 힌트: ${q.hint}
                        </div>
                    </div>
                `;
            } else if (currentSlide === 24) {
                // Master Badge
                const correctCount = Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length;
                const score = correctCount * 20;
                playSound('fanfare');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                }
                body.innerHTML = `
                    <div class="text-center py-4">
                        <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-emerald-500 to-teal-500 shadow-[0_0_35px_rgba(16,185,129,0.5)] flex items-center justify-center text-4xl mb-3">
                            🏆
                        </div>
                        <span class="text-xs font-bold text-emerald-400 font-kids tracking-widest uppercase">Paleontology Master Certificate</span>
                        <h3 class="font-kids text-3xl md:text-4xl text-white mt-1 mb-2">
                            은찬이의 공룡 탐험 수료를 축하합니다! 🎉
                        </h3>
                        <p class="text-slate-300 text-xs md:text-sm mb-4 font-sans">
                            중생대 트라이아스기부터 티라노사우루스, 그리고 조류의 진화까지 훌륭하게 탐구했어요!
                        </p>
                        <div class="inline-flex items-center gap-4 p-4 rounded-2xl bg-emerald-950/40 border border-emerald-500/30 text-center mb-6">
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">퀴즈 성적</span>
                                <span class="font-kids text-2xl text-emerald-300">${score}점</span>
                            </div>
                            <div class="w-px h-8 bg-emerald-500/30"></div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">수여 칭호</span>
                                <span class="font-kids text-lg text-amber-300">선사시대 공룡 명예 박사 🦕</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-3 font-kids text-xs">
                            <a href="eunchan-study.html" class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white transition shadow-lg shadow-emerald-950">
                                🎒 은찬이의 공부방 홈으로 이동
                            </a>
                            <button onclick="goToSlide(1)" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                                🔄 처음부터 다시 탐험하기
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function handleQuizAnswer(qIdx, optIdx) {
            if (quizAnswers[qIdx] !== undefined) return;
            quizAnswers[qIdx] = optIdx;
            if (optIdx === QUIZ_QUESTIONS[qIdx].ans) {
                playSound('correct');
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        // Dinosaur Real Size Comparison Canvas
        function drawDinoSize(dIdx) {
            const canvas = document.getElementById('dinoSizeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const groundY = h - 35;

            // Ground line
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(w, groundY);
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw Eunchan (7-year-old child: height ~1.2m)
            const scale = 12; // 1 meter = 12 pixels
            const eunchanHeight = 1.2 * scale; // ~14.4px
            const ex = 50;

            // Kid Figure
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(ex, groundY - eunchanHeight - 5, 4, 0, Math.PI * 2); // head
            ctx.fill();
            ctx.fillRect(ex - 2.5, groundY - eunchanHeight, 5, eunchanHeight); // body

            ctx.font = 'bold 11px sans-serif';
            ctx.fillStyle = '#38bdf8';
            ctx.textAlign = 'center';
            ctx.fillText('은찬이 (1.2m)', ex, groundY + 20);

            // Draw Target Dinosaur
            const target = DINOS[dIdx];
            const dinoLen = target.length * scale;
            const dinoH = target.height * scale;
            const dx = 130;

            ctx.fillStyle = target.color;
            ctx.beginPath();
            // stylized shape
            ctx.roundRect(dx, groundY - dinoH, Math.min(w - dx - 20, dinoLen), dinoH, 8);
            ctx.fill();

            // Label
            ctx.font = 'bold 13px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText(`${target.name} (길이 ${target.length}m / 키 ${target.height}m)`, dx + 10, groundY - dinoH - 10);

            ctx.font = '11px sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(`은찬이보다 키가 약 ${(target.height / 1.2).toFixed(1)}배 커요!`, dx + 10, groundY - dinoH + 20);
        }

        // TTS Read Aloud
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-emerald-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[🦕🦖🌿⏳🐚🦣🍌🛡️🔨🏃‍♂️🦴🦇🐋☄️🐦🇰🇷🎯🏆💡Q\d\.]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-emerald-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-emerald-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('canvas, button, a, input, select, textarea')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive) {
                touchStartedOnInteractive = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        // Init
        renderSlide();
    </script>
</body>
</html>
