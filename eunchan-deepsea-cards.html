    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'dive') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.6);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
                osc.start(now);
                osc.stop(now + 0.65);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

        function updateProgress() {
            document.getElementById('slideIndicator').textContent = currentSlide;
            const pct = (currentSlide / totalSlides) * 100;
            document.getElementById('topProgressBar').style.width = pct + '%';
            document.getElementById('prevBtn').disabled = (currentSlide === 1);
            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);

            const dotsCont = document.getElementById('dotsContainer');
            dotsCont.innerHTML = '';
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all flex-shrink-0 ${i === currentSlide ? 'w-5 bg-cyan-400' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(i);
                dotsCont.appendChild(dot);
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                playSound('pop');
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                playSound('pop');
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(n) {
            playSound('pop');
            currentSlide = n;
            renderSlide();
            const drawer = document.getElementById('indexDrawer');
            if (!drawer.classList.contains('hidden')) drawer.classList.add('hidden');
        }

            const drawer = document.getElementById('indexDrawer');

                list.innerHTML = '';
                SLIDE_TITLES.forEach((t, idx) => {

                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentSlide === 17) {
                // Interactive Depth Slider Simulator
                body.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                            <div>
                                <span class="text-xs font-bold text-cyan-400 font-kids">슬라이더를 움직여서</span>
                                <h3 class="font-kids text-2xl text-white">바닷속 깊이 탐험 시뮬레이터</h3>
                            </div>
                            <span class="text-[11px] text-slate-400 font-kids">더 깊이 내려가볼까요? 👇</span>
                        </div>
                        <div class="p-4 bg-slate-900 rounded-3xl border border-slate-800 flex flex-col items-center">
                            <canvas id="depthCanvas" width="580" height="260" class="w-full max-w-[580px] h-[260px] rounded-2xl border border-slate-700"></canvas>
                            <input type="range" id="depthSlider" min="0" max="4000" step="25" value="0" oninput="updateDepthSim(this.value)" class="w-full max-w-[580px] mt-3 accent-cyan-400">
                            <div class="w-full max-w-[580px] flex items-center justify-between text-[10px] text-slate-500 font-kids mt-0.5">
                                <span>0m (바다 표면)</span>
                                <span>4,000m (심해 바닥층)</span>
                            </div>
                            <div class="grid sm:grid-cols-2 gap-2 w-full max-w-[580px] mt-3">
                                <div id="depthZoneLabel" class="p-3 bg-slate-800/80 rounded-xl border border-slate-700 text-xs font-kids text-cyan-300 text-center"></div>
                                <div id="depthCreatureLabel" class="p-3 bg-slate-800/80 rounded-xl border border-slate-700 text-xs font-kids text-amber-300 text-center"></div>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => updateDepthSim(0), 50);
            } else if (currentSlide === 18) {
                const allFriends = [...CREATURES, { name: "ALVIN 잠수정", img: ALVIN.img, alt: ALVIN.alt, fallback: ALVIN.fallback, badge: "bg-slate-600/90 text-white", zone: "탐험가", num: "07" }];
                body.innerHTML = `
                    <div>
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-3xl">🗂️</span>
                            <div>
                                <span class="text-xs font-bold text-cyan-400 font-kids">지금까지 만난 심해 친구들</span>
                                <h3 class="font-kids text-2xl text-white">신비한 친구들 총정리 갤러리</h3>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            ${allFriends.map(c => `
                                <div class="relative h-24 rounded-xl overflow-hidden border border-slate-700">
                                    <!-- Photo: ${c.alt}, Wikimedia Commons, see file page for license -->
                                    <img src="${c.img}" loading="lazy" decoding="async" alt="${c.alt}" class="w-full h-full object-cover img-reveal" onerror="imgFallbackEmoji(this,'${c.fallback}')">
                                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-transparent to-transparent"></div>
                                    <span class="absolute bottom-1.5 left-1.5 right-1.5 text-[10px] text-white font-kids leading-tight drop-shadow">${c.name.split(' (')[0]}</span>
                                </div>
                            `).join('')}
                        </div>
                        <p class="text-[11px] text-slate-400 font-kids text-center mt-3">
                            🔦 아귀 · 🦑 대왕오징어 · 🐛 대왕쥐며느리 · 🐙 덤보문어 · 🧛 흡혈오징어 · 🌋 관벌레 · 🤖 ALVIN
                        </p>
                    </div>
                `;
            } else if (currentSlide >= 19 && currentSlide <= 23) {
                // Quiz
                const qIdx = currentSlide - 19;
                const q = QUIZ_QUESTIONS[qIdx];
                const selected = quizAnswers[qIdx];
                body.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-cyan-400 font-kids">🎯 심해 탐험 퀴즈 (${qIdx + 1} / 5)</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-kids">점수: ${Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length * 20}점</span>
                        </div>
                        <h3 class="font-kids text-xl md:text-2xl text-white mb-4 leading-snug">
                            Q${qIdx + 1}. ${q.q}
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${q.options.map((opt, optIdx) => {
                                let style = "bg-slate-800/90 border-slate-700 hover:bg-slate-700 text-slate-200";
                                if (selected !== undefined) {
                                    if (optIdx === q.ans) style = "bg-cyan-600/90 border-cyan-400 text-white font-bold ring-2 ring-cyan-400";
                                    else if (optIdx === selected) style = "bg-rose-600/90 border-rose-400 text-white font-bold";
                                }
                                return `
                                    <button onclick="handleQuizAnswer(${qIdx}, ${optIdx})" class="p-4 rounded-2xl border text-left font-kids text-sm transition ${style}">
                                        ${optIdx + 1}. ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-xs text-slate-400 font-kids">
                            💡 힌트: ${q.hint}
                        </div>
                    </div>
                `;
            } else if (currentSlide === 24) {
                // Master Badge
                const correctCount = Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length;
                const score = correctCount * 20;
                playSound('fanfare');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                }
                body.innerHTML = `
                    <div class="text-center py-4">
                        <div class="relative h-40 rounded-3xl overflow-hidden border border-slate-700 mb-4 max-w-md mx-auto">
                            <!-- Photo: ALVIN submersible, Wikimedia Commons, see file page for license -->
                            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/ALVIN%20submersible.jpg?width=900" loading="lazy" decoding="async" alt="심해 탐사를 마친 ALVIN 잠수정" class="w-full h-full object-cover ken-burns" onerror="imgFallbackEmoji(this,'🤖')">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent"></div>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-cyan-500 to-teal-500 shadow-[0_0_35px_rgba(34,211,238,0.5)] flex items-center justify-center text-4xl">
                                    🏆
                                </div>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-cyan-400 font-kids tracking-widest uppercase">Deep-Sea Explorer Certificate</span>
                        <h3 class="font-kids text-3xl md:text-4xl text-white mt-1 mb-2">
                            은찬이의 심해 탐험 수료를 축하합니다! 🎉
                        </h3>
                        <p class="text-slate-300 text-xs md:text-sm mb-4 font-sans">
                            햇빛층부터 심해 바닥층까지, 아귀와 대왕오징어부터 열수구 관벌레와 ALVIN 잠수정까지 훌륭하게 탐구했어요!
                        </p>
                        <div class="inline-flex items-center gap-4 p-4 rounded-2xl bg-cyan-950/40 border border-cyan-500/30 text-center mb-6">
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">퀴즈 성적</span>
                                <span class="font-kids text-2xl text-cyan-300">${score}점</span>
                            </div>
                            <div class="w-px h-8 bg-cyan-500/30"></div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">수여 칭호</span>
                                <span class="font-kids text-lg text-amber-300">심해 탐험가 🐙</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-3 font-kids text-xs">
                            <a href="eunchan-study.html" class="px-6 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white transition shadow-lg shadow-cyan-950">
                                🎒 은찬이의 공부방 홈으로 이동
                            </a>
                            <button onclick="goToSlide(1)" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                                🔄 처음부터 다시 탐험하기
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function handleQuizAnswer(qIdx, optIdx) {
            if (quizAnswers[qIdx] !== undefined) return;
            quizAnswers[qIdx] = optIdx;
            if (optIdx === QUIZ_QUESTIONS[qIdx].ans) {
                playSound('correct');
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        // Depth Slider Simulator (mirrors the size-comparison canvas technique from eunchan-dinosaur-cards.html)
        const SIM_MAX_DEPTH = 4000;
        const SIM_CREATURES = [
            { depth: 1000, emoji: "🔦", name: "아귀" },
            { depth: 600, emoji: "🦑", name: "대왕오징어" },
            { depth: 1350, emoji: "🐛", name: "대왕쥐며느리" },
            { depth: 3500, emoji: "🐙", name: "덤보문어" },
            { depth: 750, emoji: "🧛", name: "흡혈오징어" },
            { depth: 3000, emoji: "🌋", name: "관벌레(열수구)" }
        ];

        function zoneForDepth(depth) {
            if (depth < 200) return ZONES[0];
            if (depth < 1000) return ZONES[1];
            if (depth < 4000) return ZONES[2];
            return ZONES[3];
        }

        function updateDepthSim(value) {
            const depth = parseInt(value, 10);
            const canvas = document.getElementById('depthCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // Background gradient: bright blue (surface) -> dark navy -> black (abyss)
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#7dd3fc');
            grad.addColorStop(0.05, '#38bdf8');
            grad.addColorStop(0.25, '#0891b2');
            grad.addColorStop(0.25, '#0c4a6e');
            grad.addColorStop(0.6, '#082f49');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Zone boundary lines
            const boundaries = [
                { d: 200, label: "황혼층 시작 (200m)" },
                { d: 1000, label: "밤바다층 시작 (1,000m)" },
                { d: 4000, label: "심해 바닥층 (4,000m~)" }
            ];
            boundaries.forEach(b => {
                const y = (b.d / SIM_MAX_DEPTH) * h;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.font = '10px sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.65)';
                ctx.textAlign = 'right';
                ctx.fillText(b.label, w - 6, Math.max(12, y - 4));
            });

            // Current depth marker
            const markerY = Math.min(h - 6, Math.max(6, (depth / SIM_MAX_DEPTH) * h));
            ctx.beginPath();
            ctx.arc(45, markerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf24';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = 'bold 12px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText(`깊이 ${depth.toLocaleString()}m`, 62, markerY + 4);

            // Update labels
            const zone = zoneForDepth(depth);
            const zoneLabelEl = document.getElementById('depthZoneLabel');
            if (zoneLabelEl) zoneLabelEl.innerHTML = `📍 <strong>${zone.name}</strong><br><span class="text-slate-400 text-[10px]">${zone.light}</span>`;

            let nearest = SIM_CREATURES[0];
            let bestDist = Math.abs(depth - nearest.depth);
            SIM_CREATURES.forEach(c => {
                const dist = Math.abs(depth - c.depth);
                if (dist < bestDist) { bestDist = dist; nearest = c; }
            });
            const creatureLabelEl = document.getElementById('depthCreatureLabel');
            if (creatureLabelEl) {
                if (bestDist <= 700) {
                    creatureLabelEl.innerHTML = `${nearest.emoji} 이 근처엔<br><strong>${nearest.name}</strong>가 살아요!`;
                } else {
                    creatureLabelEl.innerHTML = `🌊 이 깊이엔 아직<br>발견 못한 친구가 있을지도!`;
                }
            }
        }

        // TTS Read Aloud
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-cyan-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            // Strip emoji (broad unicode ranges) and quiz "Q1." style labels before reading aloud
            const textToRead = slide.innerText
                .replace(/[\p{Extended_Pictographic}‍️]/gu, ' ')
                .replace(/Q\d+\./g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-cyan-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-cyan-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('canvas, button, a, input, select, textarea')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive) {
                touchStartedOnInteractive = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        // Init
        renderSlide();
    </script>

    <!-- Mobile Swipe Support -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('slideCard');
            if (card) {
                let touchStartX = 0;
                let touchEndX = 0;
                
                card.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].screenX;
                }, {passive: true});
                
                card.addEventListener('touchend', e => {
                    touchEndX = e.changedTouches[0].screenX;
                    handleSwipe();
                }, {passive: true});
                
                function handleSwipe() {
                    const threshold = 50;
                    if (touchEndX < touchStartX - threshold) {
                        if (typeof nextSlide === 'function') nextSlide();
                    }
                    if (touchEndX > touchStartX + threshold) {
                        if (typeof prevSlide === 'function') prevSlide();
                    }
                }
            }
        });
    </script>
</body>
</html>
