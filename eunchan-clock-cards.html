    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'launch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.6);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'bell') {
                [880, 1320].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now);
                    g.gain.setValueAtTime(0.18, now);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
                    o.start(now);
                    o.stop(now + 1.1);
                });
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

    <!-- Clock Face / Drag Widget Engine -->
    <script>
        function buildClockFaceBase() {
            const cx = 150, cy = 150, r = 140;
            let ticks = '';
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * Math.PI / 180;
                const isHour = i % 5 === 0;
                const outerR = r - 4;
                const innerR = isHour ? r - 16 : r - 9;
                const x1 = cx + outerR * Math.sin(angle);
                const y1 = cy - outerR * Math.cos(angle);
                const x2 = cx + innerR * Math.sin(angle);
                const y2 = cy - innerR * Math.cos(angle);
                ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${isHour ? '#78350f' : '#c9962c'}" stroke-width="${isHour ? 3 : 1.3}" stroke-linecap="round" />`;
            }
            let numerals = '';
            for (let n = 1; n <= 12; n++) {
                const angle = (n * 30) * Math.PI / 180;
                const nr = r - 34;
                const x = cx + nr * Math.sin(angle);
                const y = cy - nr * Math.cos(angle) + 8;
                numerals += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="22" font-weight="900" font-family="'Jua', sans-serif" fill="#3f2a0f">${n}</text>`;
            }
            return `
                <circle cx="${cx}" cy="${cy}" r="${r}" fill="#f5efe0" stroke="#b5651d" stroke-width="5" />
                <circle cx="${cx}" cy="${cy}" r="${r - 22}" fill="none" stroke="#e7d5ac" stroke-width="1.5" />
                ${ticks}
                ${numerals}
            `;
        }
        const CLOCK_FACE_BASE = buildClockFaceBase();

        function buildClockHandsSVG(prefix, totalMinutes) {
            const hourDeg = totalMinutes * 0.5;
            const minuteDeg = (totalMinutes % 60) * 6;
            return `
                <g id="${prefix}HourGroup" class="clock-hand-group" style="transform: rotate(${hourDeg}deg)">
                    <line x1="150" y1="150" x2="150" y2="80" stroke="#3f2a0f" stroke-width="9" stroke-linecap="round" />
                </g>
                <g id="${prefix}MinuteGroup" class="clock-hand-group" style="transform: rotate(${minuteDeg}deg)">
                    <line x1="150" y1="150" x2="150" y2="42" stroke="#b5651d" stroke-width="5.5" stroke-linecap="round" />
                </g>
                <circle cx="150" cy="150" r="9" fill="#3f2a0f" />
                <circle cx="150" cy="150" r="3.5" fill="#f2c14e" />
            `;
        }

        function buildDraggableClockSVG(prefix, totalMinutes) {
            return `
                <svg id="${prefix}Svg" viewBox="0 0 300 300" class="clock-svg w-full max-w-[300px] mx-auto block">
                    ${CLOCK_FACE_BASE}
                    ${buildClockHandsSVG(prefix, totalMinutes)}
                </svg>
            `;
        }

        function angleFromCenter(x, y) {
            let rad = Math.atan2(x - 150, -(y - 150));
            let deg = rad * 180 / Math.PI;
            if (deg < 0) deg += 360;
            return deg;
        }

        function svgUserPoint(svg, clientX, clientY) {
            const rect = svg.getBoundingClientRect();
            return {
                x: (clientX - rect.left) / rect.width * 300,
                y: (clientY - rect.top) / rect.height * 300
            };
        }

        function formatClockDisplay(totalMinutes) {
            const h24 = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            const h12 = h24 === 0 ? 12 : h24;
            return { h12, m, mStr: String(m).padStart(2, '0') };
        }

        function attachClockDrag(prefix, state, getSnapStep, onChange) {
            const svg = document.getElementById(prefix + 'Svg');
            if (!svg) return null;
            const hourGroup = document.getElementById(prefix + 'HourGroup');
            const minuteGroup = document.getElementById(prefix + 'MinuteGroup');
            let draggedHand = null;

            function redraw() {
                const hourDeg = state.totalMinutes * 0.5;
                const minuteDeg = (state.totalMinutes % 60) * 6;
                hourGroup.style.transform = `rotate(${hourDeg}deg)`;
                minuteGroup.style.transform = `rotate(${minuteDeg}deg)`;
            }

            function pickHand(x, y) {
                const dx = x - 150, dy = y - 150;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return Math.abs(dist - 70) < Math.abs(dist - 108) ? 'hour' : 'minute';
            }

            function handleMove(clientX, clientY) {
                const { x, y } = svgUserPoint(svg, clientX, clientY);
                const angle = angleFromCenter(x, y);
                const step = getSnapStep();
                if (draggedHand === 'minute') {
                    const rawMinute = angle / 6;
                    const snapped = Math.round(rawMinute / step) * step % 60;
                    const oldMinutePart = state.totalMinutes % 60;
                    let delta = snapped - oldMinutePart;
                    if (delta < -30) delta += 60;
                    if (delta > 30) delta -= 60;
                    state.totalMinutes = ((state.totalMinutes + delta) % 720 + 720) % 720;
                } else if (draggedHand === 'hour') {
                    const totalFloat = angle * 2;
                    const hourPart = Math.floor(totalFloat / 60);
                    const minutePart = Math.round((totalFloat % 60) / step) * step % 60;
                    state.totalMinutes = ((hourPart * 60 + minutePart) % 720 + 720) % 720;
                } else {
                    return;
                }
                redraw();
                onChange(state.totalMinutes);
            }

            function onDown(e) {
                e.preventDefault();
                e.stopPropagation();
                if (e.touches) touchStartedOnInteractive = true;
                const point = e.touches ? e.touches[0] : e;
                const { x, y } = svgUserPoint(svg, point.clientX, point.clientY);
                draggedHand = pickHand(x, y);
                handleMove(point.clientX, point.clientY);
            }
            function onMove(e) {
                if (!draggedHand) return;
                const point = e.touches ? e.touches[0] : e;
                handleMove(point.clientX, point.clientY);
            }
            function onUp() {
                draggedHand = null;
            }

            svg.addEventListener('mousedown', onDown);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            svg.addEventListener('touchstart', onDown, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onUp);

            return function cleanup() {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onUp);
            };
        }
    </script>

    <script>
        const MISSION_TARGETS = [
            { h: 3, m: 0, label: '3시 정각' },
            { h: 7, m: 30, label: '7시 30분' },
            { h: 10, m: 15, label: '10시 15분' },
            { h: 1, m: 45, label: '1시 45분' },
            { h: 6, m: 5, label: '6시 5분' }
        ];
        let missionState = { idx: 0, totalMinutes: 0, solved: [false, false, false, false, false], feedback: '' };

        function targetTotalMinutes(t) { return (t.h % 12) * 60 + t.m; }
        function missionSnapGetter() { return 1; }

        function updateMissionReadout() {
            const { h12, mStr } = formatClockDisplay(missionState.totalMinutes);
            const el = document.getElementById('missionReadout');
            if (el) el.textContent = `지금 가리키는 시각: ${h12}시 ${mStr}분`;
        }

        function checkMission() {
            const target = MISSION_TARGETS[missionState.idx];
            const targetMin = targetTotalMinutes(target);
            const diff = Math.abs(missionState.totalMinutes - targetMin);
            const circDiff = Math.min(diff, 720 - diff);
            if (circDiff <= 2) {
                missionState.solved[missionState.idx] = true;
                missionState.feedback = 'correct';
                playSound('correct');
                if (typeof confetti === 'function') confetti({ particleCount: 40, spread: 55, origin: { y: 0.5 } });
            } else {
                missionState.feedback = 'wrong';
                playSound('wrong');
            }
            renderSlide();
        }

        function nextMission() {
            if (missionState.idx < MISSION_TARGETS.length - 1) {
                missionState.idx++;
                missionState.totalMinutes = 0;
                missionState.feedback = '';
                renderSlide();
            }
        }
    </script>

    <script>
        const WORLD_CITIES = [
            { flag: '🇰🇷', name: '대한민국 · 서울', tz: 'Asia/Seoul', isHome: true },
            { flag: '🇩🇰', name: '덴마크 · 코펜하겐', tz: 'Europe/Copenhagen' },
            { flag: '🇻🇳', name: '베트남 · 하노이', tz: 'Asia/Ho_Chi_Minh' },
            { flag: '🇬🇧', name: '영국 · 런던', tz: 'Europe/London' },
            { flag: '🇺🇸', name: '미국 · 뉴욕(동부)', tz: 'America/New_York' },
            { flag: '🇺🇸', name: '미국 · LA(서부)', tz: 'America/Los_Angeles' }
        ];

        function getOffsetHours(tz, now) {
            try {
                const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(now);
                const part = parts.find(p => p.type === 'timeZoneName');
                const m = part && part.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                if (!m) return 0;
                const h = parseInt(m[1], 10);
                const mins = m[2] ? parseInt(m[2], 10) : 0;
                return h + (h < 0 ? -mins / 60 : mins / 60);
            } catch (e) { return 0; }
        }

        function updateWorldClocks() {
            const now = new Date();
            const koreaOffset = getOffsetHours('Asia/Seoul', now);
            WORLD_CITIES.forEach((c, i) => {
                const timeStr = now.toLocaleTimeString('ko-KR', { timeZone: c.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                const hourNum = parseInt(now.toLocaleString('en-US', { timeZone: c.tz, hour: '2-digit', hour12: false }), 10);
                const dayNight = (hourNum >= 6 && hourNum < 18) ? '🌞' : '🌙';
                const offset = getOffsetHours(c.tz, now);
                const diff = Math.round((offset - koreaOffset) * 10) / 10;
                let diffLabel;
                if (c.isHome) diffLabel = '🇰🇷 기준 시각';
                else if (diff === 0) diffLabel = '한국과 시차 없음';
                else diffLabel = `한국보다 ${Math.abs(diff)}시간 ${diff > 0 ? '빨라요' : '느려요'}`;
                const timeEl = document.getElementById(`wcTime${i}`);
                const diffEl = document.getElementById(`wcDiff${i}`);
                const emojiEl = document.getElementById(`wcEmoji${i}`);
                if (timeEl) timeEl.textContent = timeStr;
                if (diffEl) diffEl.textContent = diffLabel;
                if (emojiEl) emojiEl.textContent = dayNight;
            });
        }
    </script>

    <script>
        const SUNDIAL_POSITIONS = {
            morning: { angle: -55, length: 92, label: '아침 (그림자가 길고 한쪽으로 길게 기울어요)' },
            noon: { angle: 0, length: 30, label: '한낮 (해가 높이 떠서 그림자가 가장 짧아요)' },
            afternoon: { angle: 55, length: 92, label: '오후 (그림자가 다시 길어지며 반대쪽으로 기울어요)' }
        };
        let sundialPos = 'noon';

        function setSundialPos(pos) {
            sundialPos = pos;
            renderSundialShadow();
        }

        function renderSundialShadow() {
            const cfg = SUNDIAL_POSITIONS[sundialPos];
            if (!cfg) return;
            const rad = cfg.angle * Math.PI / 180;
            const x2 = 150 + cfg.length * Math.sin(rad);
            const y2 = 150 + cfg.length * Math.cos(rad);
            const shadow = document.getElementById('sundialShadow');
            if (shadow) { shadow.setAttribute('x2', x2); shadow.setAttribute('y2', y2); }
            const label = document.getElementById('sundialLabel');
            if (label) label.textContent = cfg.label;
            ['morning', 'noon', 'afternoon'].forEach(p => {
                const b = document.getElementById('sundialBtn_' + p);
                if (!b) return;
                if (p === sundialPos) {
                    b.classList.add('bg-clock-brass', 'text-slate-950');
                    b.classList.remove('bg-slate-800', 'text-slate-200');
                } else {
                    b.classList.remove('bg-clock-brass', 'text-slate-950');
                    b.classList.add('bg-slate-800', 'text-slate-200');
                }
            });
        }

                bell.classList.add('bell-shake');
                setTimeout(() => {

                }, 650);
            }
        }

    <!-- TTS Read Aloud -->
    <script>
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-clock-brass', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}️]/gu, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-clock-brass', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-clock-brass', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('canvas, button, a, input, select, textarea, svg')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive) {
                touchStartedOnInteractive = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });
    </script>
