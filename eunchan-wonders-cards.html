    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

        let worldFeatures = null;
        fetch('data/world-110m.json')

                console.error('Local world data error, trying CDN fallback:', err);
                fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
                    .then(r => r.json())
                    .then(topo => {
                        worldFeatures = topojson.feature(topo, topo.objects.countries);

        const wondersGlobe = { rotation: [-20, -15, 0], visited: new Set(), selected: null, pinPos: [] };

        function angularDistanceDeg(lon1, lat1, lon2, lat2) {
            const toRad = Math.PI / 180;
            const p1 = lat1 * toRad, p2 = lat2 * toRad, dl = (lon2 - lon1) * toRad;
            const cosd = Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dl);
            return Math.acos(Math.max(-1, Math.min(1, cosd))) * 180 / Math.PI;
        }

        function renderWondersGlobe(canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = Math.min(width, height) / 2 - 14;

            const projection = d3.geoOrthographic()
                .scale(radius)
                .translate([width / 2, height / 2])
                .rotate(wondersGlobe.rotation)
                .clipAngle(90);
            const path = d3.geoPath().projection(projection).context(ctx);

            ctx.clearRect(0, 0, width, height);

            // Ocean sphere with radial glow
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, radius, 0, 2 * Math.PI);
            const grad = ctx.createRadialGradient(width / 2 - radius * 0.3, height / 2 - radius * 0.3, radius * 0.1, width / 2, height / 2, radius);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, '#09111e');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();

            if (worldFeatures) {
                // Graticules
                const graticule = d3.geoGraticule10();
                ctx.beginPath();
                path(graticule);
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
                ctx.stroke();

                // Land
                worldFeatures.features.forEach(f => {
                    ctx.beginPath();
                    path(f);
                    ctx.fillStyle = '#334155';
                    ctx.fill();
                    ctx.lineWidth = 0.5;
                    ctx.strokeStyle = '#1e293b';
                    ctx.stroke();
                });
            }

            // Landmark pins (visible hemisphere only)
            wondersGlobe.pinPos = [];
            const rot = projection.rotate();
            const centerLon = -rot[0], centerLat = -rot[1];
            LANDMARKS.forEach(w => {
                const d = angularDistanceDeg(w.lon, w.lat, centerLon, centerLat);
                if (d < 90) {
                    const xy = projection([w.lon, w.lat]);
                    if (!xy) return;
                    const visited = wondersGlobe.visited.has(w.key);
                    const isSelected = wondersGlobe.selected === w.key;
                    ctx.beginPath();
                    ctx.arc(xy[0], xy[1], isSelected ? 7 : 5, 0, 2 * Math.PI);
                    ctx.fillStyle = visited ? '#34d399' : '#eab308';
                    ctx.fill();
                    ctx.lineWidth = isSelected ? 2.5 : 1.5;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    wondersGlobe.pinPos.push({ x: xy[0], y: xy[1], key: w.key });
                }
            });

            // Atmosphere rim shadow
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, radius, 0, 2 * Math.PI);
            const rimGrad = ctx.createRadialGradient(width / 2, height / 2, radius * 0.75, width / 2, height / 2, radius);
            rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
            rimGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = rimGrad;
            ctx.fill();
        }

        function handleWondersTap(canvas, clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            let hit = null;
            let bestDist = 18;
            wondersGlobe.pinPos.forEach(p => {
                const d = Math.hypot(p.x - x, p.y - y);
                if (d < bestDist) { bestDist = d; hit = p; }
            });
            if (hit) {
                wondersGlobe.selected = hit.key;
                wondersGlobe.visited.add(hit.key);
                playSound('pop');
                renderWondersGlobe(canvas);
                updateWonderInfoPanel();
            }
        }

        function updateWonderInfoPanel() {
            const panel = document.getElementById('wonderInfoPanel');
            const counter = document.getElementById('wonderVisitedCount');
            if (counter) counter.textContent = `발견: ${wondersGlobe.visited.size} / ${LANDMARKS.length}`;
            if (!panel) return;
            const w = LANDMARKS.find(l => l.key === wondersGlobe.selected);
            if (!w) return;
            panel.innerHTML = `
                <div class="text-left w-full">
                    <span class="text-2xl">${w.emoji}</span>
                    <h4 class="font-kids text-lg text-white inline-block ml-1">${w.nameKo}</h4>
                    <p class="text-[11px] text-slate-400 mb-1">${w.nameEn} · ${w.country}</p>
                    <p class="text-xs text-slate-300 leading-relaxed">${w.oneLiner}</p>
                </div>
            `;
        }

        function initWondersGlobe(canvas) {
            if (!canvas) return;
            renderWondersGlobe(canvas);
            if (canvas._hasWondersListeners) return;
            canvas._hasWondersListeners = true;

            let dragging = false;
            let lastPos = [0, 0];
            let downPos = [0, 0];

            function getXYany(e) {
                if (e.changedTouches && e.changedTouches.length) return [e.changedTouches[0].clientX, e.changedTouches[0].clientY];
                if (e.touches && e.touches.length) return [e.touches[0].clientX, e.touches[0].clientY];
                return [e.clientX, e.clientY];
            }

            function onDown(e) {
                dragging = true;
                isInteractingWithMap = true;
                touchStartedOnInteractive = true;
                canvas.style.cursor = 'grabbing';
                const p = getXYany(e);
                lastPos = p;
                downPos = p;
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
            }
            function onMove(e) {
                if (!dragging) return;
                isInteractingWithMap = true;
                const p = getXYany(e);
                const dx = p[0] - lastPos[0];
                const dy = p[1] - lastPos[1];
                lastPos = p;
                wondersGlobe.rotation[0] += dx * 0.4;
                wondersGlobe.rotation[1] = Math.max(-80, Math.min(80, wondersGlobe.rotation[1] - dy * 0.4));
                renderWondersGlobe(canvas);
                if (e.cancelable) e.preventDefault();
            }
            function onUp(e) {
                dragging = false;
                canvas.style.cursor = 'grab';
                const p = getXYany(e);
                const dist = Math.hypot(p[0] - downPos[0], p[1] - downPos[1]);
                if (dist < 6) handleWondersTap(canvas, downPos[0], downPos[1]);
                setTimeout(() => { isInteractingWithMap = false; }, 120);
            }

            canvas.addEventListener('mousedown', onDown);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            canvas.addEventListener('touchstart', onDown, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onUp);
        }

        // TTS Read Aloud
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-sky-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-sky-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[🗿📜🗳️🏛️🕌🐉🏟️🐍🙏🏔️🗼🗽🌐🗺️🎯🏆💡⏳💗🔢☁️✨🧭🌍🚄⚾😲🎉🔄🎒👆🌟📏Q\d\.]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.add('text-sky-300', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-sky-300', 'animate-pulse');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (isInteractingWithMap || e.target.closest('canvas, button, a, input, select, textarea')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive || isInteractingWithMap) {
                touchStartedOnInteractive = false;
                isInteractingWithMap = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        // Init
        renderSlide();
    </script>
</body>
</html>
