    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'launch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.6);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

        function updateProgress() {
            document.getElementById('slideIndicator').textContent = currentSlide;
            const pct = (currentSlide / totalSlides) * 100;
            document.getElementById('topProgressBar').style.width = pct + '%';
            document.getElementById('prevBtn').disabled = (currentSlide === 1);
            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);

            const dotsCont = document.getElementById('dotsContainer');
            dotsCont.innerHTML = '';
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all flex-shrink-0 ${i === currentSlide ? 'w-5 bg-purple-400' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(i);
                dotsCont.appendChild(dot);
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                playSound('pop');
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                playSound('pop');
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(n) {
            playSound('pop');
            currentSlide = n;
            renderSlide();
            const drawer = document.getElementById('indexDrawer');
            if (!drawer.classList.contains('hidden')) drawer.classList.add('hidden');
        }

                    btn.textContent = t;
                    btn.onclick = () => goToSlide(idx + 1);
                    list.appendChild(btn);
                });
            }
        }

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${q.options.map((opt, optIdx) => {
                                let style = "bg-slate-800/90 border-slate-700 hover:bg-slate-700 text-slate-200";
                                if (selected !== undefined) {
                                    if (optIdx === q.ans) style = "bg-emerald-600/90 border-emerald-400 text-white font-bold ring-2 ring-emerald-400";
                                    else if (optIdx === selected) style = "bg-rose-600/90 border-rose-400 text-white font-bold";
                                }
                                return `
                                    <button onclick="handleQuizAnswer(${qIdx}, ${optIdx})" class="p-4 rounded-2xl border text-left font-kids text-sm transition ${style}">
                                        ${optIdx + 1}. ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-xs text-slate-400 font-kids">
                            💡 힌트: ${q.hint}
                        </div>
                    </div>
                `;
            } else if (currentSlide === 24) {
                // Final Certification Badge
                const correctCount = Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length;
                const score = correctCount * 20;
                playSound('fanfare');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                }
                body.innerHTML = `
                    <div class="text-center py-4">
                        <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-purple-500 to-indigo-500 shadow-[0_0_35px_rgba(168,85,247,0.5)] flex items-center justify-center text-4xl mb-3">
                            🏆
                        </div>
                        <span class="text-xs font-bold text-purple-400 font-kids tracking-widest uppercase">Space Exploration Master Certificate</span>
                        <h3 class="font-kids text-3xl md:text-4xl text-white mt-1 mb-2">
                            은찬이의 우주 탐험 완주를 축하합니다! 🎉
                        </h3>
                        <p class="text-slate-300 text-xs md:text-sm mb-4 font-sans">
                            태양과 8개 행성, 달 탐사와 블랙홀까지 신비한 우주의 비밀을 완벽하게 마스터했어요!
                        </p>
                        <div class="inline-flex items-center gap-4 p-4 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-center mb-6">
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">퀴즈 성적</span>
                                <span class="font-kids text-2xl text-purple-300">${score}점</span>
                            </div>
                            <div class="w-px h-8 bg-purple-500/30"></div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">수여 칭호</span>
                                <span class="font-kids text-lg text-amber-300">태양계 명예 우주비행사 🚀</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-3 font-kids text-xs">
                            <a href="eunchan-study.html" class="px-6 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white transition shadow-lg shadow-purple-950">
                                🎒 은찬이의 공부방 홈으로 이동
                            </a>
                            <button onclick="goToSlide(1)" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                                🔄 처음부터 다시 탐험하기
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function handleQuizAnswer(qIdx, optIdx) {
            if (quizAnswers[qIdx] !== undefined) return;
            quizAnswers[qIdx] = optIdx;
            if (optIdx === QUIZ_QUESTIONS[qIdx].ans) {
                playSound('correct');
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        // Size Comparison Canvas Renderer
        function drawSizeCompare(includeSun) {
            const canvas = document.getElementById('sizeCompareCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            if (includeSun) {
                // Draw Sun arc on left
                ctx.beginPath();
                ctx.arc(-260, h / 2, 340, -Math.PI / 2, Math.PI / 2);
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText('태양 (Sun: 지름 109배)', 16, 26);

                // Planet dots on right
                const startX = 130;
                PLANETS.forEach((p, idx) => {
                    const x = startX + idx * 52;
                    const r = Math.max(2, p.earthRatio * 3.5);
                    ctx.beginPath();
                    ctx.arc(x, h / 2, r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    ctx.font = '10px sans-serif';
                    ctx.fillStyle = '#cbd5e1';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name.split(' ')[0], x, h / 2 + 35);
                });
            } else {
                // Focus on 8 planets
                const spacing = w / 9;
                PLANETS.forEach((p, idx) => {
                    const x = spacing * (idx + 1);
                    const r = Math.max(3, p.earthRatio * 4.8);
                    ctx.beginPath();
                    ctx.arc(x, h / 2 - 15, r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (idx === 5) { // Saturn ring
                        ctx.beginPath();
                        ctx.ellipse(x, h / 2 - 15, r * 2.2, r * 0.45, -Math.PI / 8, 0, Math.PI * 2);
                        ctx.strokeStyle = '#fef08a';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    }

                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name.split(' ')[0], x, h / 2 + 45);

                    ctx.font = '9px sans-serif';
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(`${p.earthRatio}x`, x, h / 2 + 60);
                });
            }
        }

        // 3D-like Orbital Simulation
        let angle = 0;
        function startOrbitSimulation() {
            const canvas = document.getElementById('orbitCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            function animate() {
                ctx.clearRect(0, 0, w, h);
                angle += 0.015;

                // Sun at center
                ctx.beginPath();
                ctx.arc(cx, cy, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 18;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw orbits and planets
                PLANETS.forEach((p, i) => {
                    const rx = 35 + i * 29;
                    const ry = rx * 0.45; // ellipse tilt
                    const speed = 1.6 / Math.sqrt(i + 1);
                    const planetAngle = angle * speed;

                    // Orbit track
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Planet
                    const px = cx + rx * Math.cos(planetAngle);
                    const py = cy + ry * Math.sin(planetAngle);
                    const r = Math.max(2.5, Math.min(6.5, p.earthRatio * 2));

                    ctx.beginPath();
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // Tiny label
                    ctx.font = '9px sans-serif';
                    ctx.fillStyle = 'rgba(203, 213, 225, 0.75)';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name.split(' ')[0], px, py - 6);
                });

                orbitAnimId = requestAnimationFrame(animate);
            }
            animate();
        }

        // TTS Read Aloud
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-purple-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[🚀☀️🪐🌡️🌋🌍🌕🔴🌀💍❄️💨💔📏🌌🕳️🌠🛰️🎯🏆💡👨‍🚀🇰🇷😭🛑🌟📦Q\d\.]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-purple-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-purple-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe Navigation (with canvas protection)
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('canvas, button, a, input, select, textarea')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive) {
                touchStartedOnInteractive = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        // Initialize First Slide
        renderSlide();
    </script>
</body>
</html>
