    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'ping') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                osc.start(now);
                osc.stop(now + 0.16);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

    <!-- Cute Mascot Character System (hand-drawn via CSS, no external art) -->
    <script>
        const MASCOTS = {
            germ: { bg: 'bg-gradient-to-br from-lime-400 to-emerald-600', spikes: 8, spikeColor: 'bg-emerald-500' },
            wbc: { bg: 'bg-gradient-to-br from-sky-300 to-blue-500', cross: true },
            rbc: { bg: 'bg-gradient-to-br from-rose-400 to-red-600', dimple: true },
            platelet: { bg: 'bg-gradient-to-br from-amber-300 to-amber-500', teardrop: true },
            spark: { bg: 'bg-gradient-to-br from-amber-300 to-orange-500', spikes: 6, spikeColor: 'bg-orange-500' }
        };

        function spikesHTML(n, colorClass) {
            let html = '';
            for (let i = 0; i < n; i++) {
                const angle = (360 / n) * i;
                html += `<div class="mascot-spike ${colorClass}" style="top:50%;left:50%;transform:translate(-50%,-50%) rotate(${angle}deg) translate(0,-46%) rotate(45deg);"></div>`;
            }
            return html;
        }

        function mascotHTML(type, opts = {}) {
            const size = opts.size || 96;
            const anim = opts.anim ? `m-${opts.anim}` : '';
            const cfg = MASCOTS[type];
            const shapeStyle = cfg.teardrop ? 'border-radius:0 50% 50% 50%; transform:rotate(45deg);' : 'border-radius:50%;';

            const faceInner = `
                <div class="eye l"></div><div class="eye r"></div>
                <div class="mouth"></div>
                <div class="mascot-blush l"></div><div class="mascot-blush r"></div>
                ${cfg.spikes ? spikesHTML(cfg.spikes, cfg.spikeColor) : ''}
                ${cfg.dimple ? `<div class="absolute rounded-full bg-black/10" style="width:38%;height:38%;top:31%;left:31%;"></div>` : ''}
                ${cfg.cross ? `
                    <div class="absolute bg-white rounded" style="width:34%;height:9%;top:45.5%;left:33%;"></div>
                    <div class="absolute bg-white rounded" style="width:9%;height:34%;top:33%;left:45.5%;"></div>
                ` : ''}
            `;
            // Rotating the whole element makes the teardrop shape, but it also tilts the eyes/mouth
            // 45deg with it — so for teardrop mascots the face is wrapped in a counter-rotated inner
            // layer (same box via inset:0) to keep the eyes/mouth upright and correctly positioned.
            const faceContent = cfg.teardrop
                ? `<div style="position:absolute;inset:0;transform:rotate(-45deg);">${faceInner}</div>`
                : faceInner;

            return `
                <div class="mascot-wrap items-center justify-center ${anim}" style="width:${size}px;height:${size}px">
                    <div class="mascot-body mascot-face relative w-full h-full ${cfg.bg} border-4 border-white/10" style="${shapeStyle}">
                        ${faceContent}
                    </div>
                </div>`;
        }

        function propBadgeHTML(emoji, fromClass, toClass, size = 88, anim = '') {
            return `
                <div class="mascot-wrap items-center justify-center rounded-full bg-gradient-to-br ${fromClass} ${toClass}
                    border-4 border-white/15 shadow-lg ${anim ? 'm-' + anim : ''}" style="width:${size}px;height:${size}px">
                    <span style="font-size:${Math.round(size * 0.5)}px" class="drop-shadow leading-none">${emoji}</span>
                </div>`;
        }
    </script>

                                    <p>${m.short}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentSlide === 3) {
                body.innerHTML = `
                    <div>
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-3xl">🩸</span>
                            <div>
                                <span class="text-xs font-bold text-rose-400 font-kids">더 자세히 알아볼까요?</span>
                                <h3 class="font-kids text-2xl text-white">혈액 3형제가 하는 일</h3>
                            </div>
                        </div>
                        <div class="space-y-3 font-sans text-xs md:text-sm text-slate-300">
                            ${BLOOD_TRIO.map(m => `
                                <div class="p-3.5 bg-slate-800/80 rounded-2xl border border-slate-700 flex items-center gap-3">
                                    ${mascotHTML(m.type, { size: 56 })}
                                    <div>
                                        <strong class="${m.color} font-kids text-sm block mb-1">${m.name} · ${m.role}</strong>
                                        ${m.detail}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentSlide >= 4 && currentSlide <= 19) {
                const offset = currentSlide - 4;
                const tIdx = Math.floor(offset / 2);
                const isSolution = offset % 2 === 1;
                const t = TOPICS[tIdx];

                if (!isSolution) {
                    body.innerHTML = `
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                <span class="text-3xl">🔎</span>
                                <div>
                                    <span class="text-xs font-bold text-rose-400 font-kids">${t.pTag}</span>
                                    <h3 class="font-kids text-2xl text-white">${t.pTitle}</h3>
                                </div>
                            </div>
                            <div class="grid md:grid-cols-2 gap-5 items-center">
                                ${mascotPanelHTML(t.mascotHtml, t.theme, t.pBadge, t.pSticker, t.pTag, 'h-56 md:h-64')}
                                <div class="space-y-3 font-sans text-xs md:text-sm text-slate-300">
                                    <p class="leading-relaxed">${t.pBody}</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const solutionMascot = t.sMascotHtml || propBadgeHTML(t.sEmoji, t.sFrom, t.sTo, 92, t.sAnim);
                    body.innerHTML = `
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                <span class="text-3xl">🦸</span>
                                <div>
                                    <span class="text-xs font-bold text-rose-400 font-kids">특별 지원군 등장!</span>
                                    <h3 class="font-kids text-2xl text-white">${t.sTitle}</h3>
                                </div>
                            </div>
                            <div class="grid md:grid-cols-[auto,1fr] gap-5 items-start">
                                <div class="flex justify-center md:justify-start">
                                    <div class="p-5 rounded-2xl bg-slate-900/80 border border-slate-700">${solutionMascot}</div>
                                </div>
                                <div class="space-y-3 font-sans text-xs md:text-sm text-slate-300">
                                    ${factsBlockHTML(t.sFacts)}
                                </div>
                            </div>
                        </div>
                    `;
                }
            } else if (currentSlide === 20) {
                body.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                            <div>
                                <span class="text-xs font-bold text-rose-400 font-kids">인터랙티브 미니게임</span>
                                <h3 class="font-kids text-2xl text-white">몸속 방어대 대작전! 🎮</h3>
                            </div>
                            <span class="text-[11px] text-slate-400 font-kids">세균이 사라지기 전에 콕! 눌러보세요 👇</span>
                        </div>
                        <div class="p-4 bg-slate-900 rounded-3xl border border-slate-800 flex flex-col items-center">
                            <div class="w-full flex items-center justify-between mb-2 px-1">
                                <span class="text-xs font-kids text-emerald-300">🦠 잡은 세균: <span id="battleScore">0 / 12</span></span>
                                <span class="text-[11px] font-kids text-slate-400">백혈구가 되어 세균을 물리쳐요!</span>
                            </div>
                            <div id="battleArena" class="relative w-full max-w-[580px] h-72 rounded-2xl border border-slate-700 overflow-hidden bg-gradient-to-br from-slate-800 to-slate-950"></div>
                            <div id="battleWinBanner" class="hidden mt-3 w-full max-w-[580px] text-center p-3 rounded-2xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 font-kids text-sm">
                                🎉 12마리 잡기 성공! 방어대 승리! 🛡️
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => startBattleGame(), 50);
            } else if (currentSlide === 21) {
                body.innerHTML = `
                    <div>
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-3xl">🗂️</span>
                            <div>
                                <span class="text-xs font-bold text-rose-400 font-kids">지금까지 배운 방어대 지원군</span>
                                <h3 class="font-kids text-2xl text-white">총정리 갤러리</h3>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-3 gap-3">
                            ${GALLERY.map(g => `
                                <div class="p-3 rounded-2xl bg-slate-900/80 border border-slate-700 flex flex-col items-center text-center gap-1.5">
                                    ${g.html}
                                    <strong class="font-kids text-xs text-white">${g.name}</strong>
                                    <span class="text-[10px] text-slate-400 font-sans">${g.line}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentSlide >= 22 && currentSlide <= 26) {
                const qIdx = currentSlide - 22;
                const q = QUIZ_QUESTIONS[qIdx];
                const selected = quizAnswers[qIdx];
                body.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-rose-400 font-kids">🎯 방어대 실전 퀴즈 (${qIdx + 1} / 5)</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 font-kids">점수: ${Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length * 20}점</span>
                        </div>
                        <h3 class="font-kids text-xl md:text-2xl text-white mb-4 leading-snug">
                            Q${qIdx + 1}. ${q.q}
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${q.options.map((opt, optIdx) => {
                                let style = "bg-slate-800/90 border-slate-700 hover:bg-slate-700 text-slate-200";
                                if (selected !== undefined) {
                                    if (optIdx === q.ans) style = "bg-blue-600/90 border-blue-400 text-white font-bold ring-2 ring-blue-400";
                                    else if (optIdx === selected) style = "bg-rose-600/90 border-rose-400 text-white font-bold";
                                }
                                return `
                                    <button onclick="handleQuizAnswer(${qIdx}, ${optIdx})" class="p-4 rounded-2xl border text-left font-kids text-sm transition ${style}">
                                        ${optIdx + 1}. ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-xs text-slate-400 font-kids">
                            💡 힌트: ${q.hint}
                        </div>
                    </div>
                `;
            } else if (currentSlide === 27) {
                const correctCount = Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length;
                const score = correctCount * 20;
                playSound('fanfare');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                }
                body.innerHTML = `
                    <div class="text-center py-4">
                        <div class="relative h-40 rounded-3xl overflow-hidden border border-slate-700 mb-4 max-w-md mx-auto bg-gradient-to-br from-med-blood/40 to-med-shield/40 flex items-center justify-center">
                            <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-med-blood to-med-shield shadow-[0_0_35px_rgba(244,63,94,0.5)] flex items-center justify-center text-4xl">
                                🏆
                            </div>
                        </div>
                        <span class="text-xs font-bold text-rose-400 font-kids tracking-widest uppercase">Body Defense Squad Certificate</span>
                        <h3 class="font-kids text-3xl md:text-4xl text-white mt-1 mb-2">
                            은찬이의 방어대 탐험 수료를 축하합니다! 🎉
                        </h3>
                        <p class="text-slate-300 text-xs md:text-sm mb-2 font-sans">
                            혈액 3형제부터 주사, 해열제, 항생제, 백신, 소화제까지 우리 몸속 방어대의 비밀을 훌륭하게 탐구했어요!
                        </p>
                        <p class="text-[11px] md:text-xs text-amber-300/90 max-w-md mx-auto mb-4 font-kids leading-relaxed">
                            💊 약은 항상 어른이나 의사 선생님과 함께 먹어야 해요!
                        </p>
                        <div class="inline-flex items-center gap-4 p-4 rounded-2xl bg-rose-950/40 border border-rose-500/30 text-center mb-6">
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">퀴즈 성적</span>
                                <span class="font-kids text-2xl text-rose-300">${score}점</span>
                            </div>
                            <div class="w-px h-8 bg-rose-500/30"></div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">수여 칭호</span>
                                <span class="font-kids text-lg text-amber-300">방어대 대장 🛡️</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-3 font-kids text-xs">
                            <a href="eunchan-study.html" class="px-6 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white transition shadow-lg shadow-rose-950">
                                🎒 은찬이의 공부방 홈으로 이동
                            </a>
                            <button onclick="goToSlide(1)" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                                🔄 처음부터 다시 탐험하기
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function handleQuizAnswer(qIdx, optIdx) {
            if (quizAnswers[qIdx] !== undefined) return;
            quizAnswers[qIdx] = optIdx;
            if (optIdx === QUIZ_QUESTIONS[qIdx].ans) {
                playSound('correct');
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        // Battle mini-game (slide 20): click germs before they vanish. Interval MUST be cleared
        // whenever we leave slide 20 — handled at the top of renderSlide() above.
        let battleInterval = null;
        let battleCaught = 0;
        let battleGoalReached = false;
        const BATTLE_GOAL = 12;

        function startBattleGame() {
            if (battleInterval) { clearInterval(battleInterval); battleInterval = null; }
            const arena = document.getElementById('battleArena');
            if (!arena) return;
            arena.innerHTML = '';
            battleCaught = 0;
            battleGoalReached = false;
            updateBattleScore();
            battleInterval = setInterval(spawnGerm, 1100);
        }

        function updateBattleScore() {
            const el = document.getElementById('battleScore');
            if (el) el.textContent = `${battleCaught} / ${BATTLE_GOAL}`;
        }

        function spawnGerm() {
            if (currentSlide !== 20 || battleGoalReached) return;
            const arena = document.getElementById('battleArena');
            if (!arena) {
                if (battleInterval) { clearInterval(battleInterval); battleInterval = null; }
                return;
            }
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'absolute';
            const x = 8 + Math.random() * 78;
            const y = 10 + Math.random() * 68;
            btn.style.left = x + '%';
            btn.style.top = y + '%';
            btn.style.transform = 'translate(-50%,-50%)';
            btn.style.transition = 'transform .2s ease, opacity .2s ease';
            btn.innerHTML = mascotHTML('germ', { size: 52, anim: 'wiggle' });
            btn.onclick = () => catchGerm(btn);
            arena.appendChild(btn);

            const missTimer = setTimeout(() => {
                if (btn.isConnected && !btn.dataset.caught) {
                    btn.remove();
                }
            }, 3200);
            btn._missTimer = missTimer;
        }

        function catchGerm(el) {
            if (el.dataset.caught) return;
            el.dataset.caught = '1';
            if (el._missTimer) clearTimeout(el._missTimer);
            playSound('pop');
            el.style.transform = 'translate(-50%,-50%) scale(0)';
            el.style.opacity = '0';
            setTimeout(() => { if (el.isConnected) el.remove(); }, 220);

            battleCaught++;
            updateBattleScore();

            if (battleCaught >= BATTLE_GOAL && !battleGoalReached) {
                battleGoalReached = true;
                if (battleInterval) { clearInterval(battleInterval); battleInterval = null; }
                playSound('fanfare');
                const banner = document.getElementById('battleWinBanner');
                if (banner) banner.classList.remove('hidden');
            }
        }

        // TTS Read Aloud
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-rose-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            // Strip emoji (broad unicode ranges) but keep digits/units so "12마리" or "4500년" read fine.
            const textToRead = slide.innerText
                .replace(/[\p{Extended_Pictographic}‍️]/gu, ' ')
                .replace(/Q\d+\./g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-rose-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-rose-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('canvas, button, a, input, select, textarea')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive) {
                touchStartedOnInteractive = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        // Init
        renderSlide();
    </script>
</body>
</html>
