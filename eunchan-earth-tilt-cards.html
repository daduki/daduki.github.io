    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.18, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

    <!-- Slide Engine & Quiz Data -->

                correct: 1,
                explain: "적도는 지구 기울기의 영향을 가장 적게 받는 위치라서, 계절이 바뀌어도 낮과 밤의 길이가 거의 12시간으로 일정해요!"
            },
            {
                q: "지구의 자전축은 몇 도 정도 기울어져 있을까요?",
                options: ["약 0도 (전혀 기울지 않음)", "약 23.5도", "약 45도", "약 90도 (완전히 누움)"],
                correct: 1,
                explain: "지구 자전축은 수직선에서 약 23.5도 정도 기울어져 있어요. 이 기울기가 계절을 만드는 핵심 비밀이랍니다!"
            },
            {
                q: "북반구가 여름일 때, 남반구는 어떤 계절일까요?",
                options: ["똑같이 여름", "겨울", "항상 봄", "계절이 없음"],
                correct: 1,
                explain: "지구가 기울어진 채 태양을 돌기 때문에, 북반구와 남반구는 항상 정반대의 계절을 겪어요!"
            },
            {
                q: "남극에서 밤이 약 6개월간 계속되는 '극야' 현상이 생기는 계절은?",
                options: ["남반구의 여름", "남반구의 겨울", "북반구의 봄", "아무 때나 똑같다"],
                correct: 1,
                explain: "남반구가 겨울일 때 남극은 태양 반대쪽으로 기울어 있어서, 거의 6개월 동안 해가 뜨지 않는 '극야'가 계속돼요!"
            },
            {
                q: "서울의 낮 길이는 여름(6월)과 겨울(12월)에 어떻게 다를까요?",
                options: ["거의 비슷하다 (12시간 vs 12시간)", "여름이 더 길다 (약 14~15시간 vs 약 9~10시간)", "겨울이 더 길다", "여름엔 낮이 없다"],
                correct: 1,
                explain: "서울은 여름에는 낮이 약 14~15시간으로 길고, 겨울에는 약 9~10시간으로 짧아져요. 지구 기울기 때문이에요!"
            }
        ];

        let currentSlide = 1;
        const totalSlides = 19;
        let quizState = { questions: [], answers: {}, score: 0 };

        function initQuiz() {
            const pool = [...QUIZ_POOL];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            quizState.questions = pool.slice(0, 5);
        }
        initQuiz();

        function updateProgress() {
            document.getElementById('slideIndicator').textContent = currentSlide;
            const pct = (currentSlide / totalSlides) * 100;
            document.getElementById('topProgressBar').style.width = pct + '%';
            document.getElementById('prevBtn').disabled = (currentSlide === 1);
            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);

            const dotsCont = document.getElementById('dotsContainer');
            dotsCont.innerHTML = '';
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all flex-shrink-0 ${i === currentSlide ? 'w-5 bg-violet-400' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(i);
                dotsCont.appendChild(dot);
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                playSound('pop');
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                playSound('pop');
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(n) {
            playSound('pop');
            currentSlide = n;
            renderSlide();
            const drawer = document.getElementById('indexDrawer');
            if (!drawer.classList.contains('hidden')) drawer.classList.add('hidden');
        }

                    "05. ☀️ 여름 vs 겨울, 햇빛 각도 차이",
                    "06. 📊 서울의 계절별 낮 길이 비교",

                    "09. 🌙 백야현상이란 무엇일까?",
                    "10. 📐 백야현상이 생기는 이유",
                    "11. ❄️ 극지방의 극단적인 낮과 밤",
                    "12. 📐 극지방에서 극야·백야가 생기는 이유",
                    "13. ✅ 전체 총정리",
                    "14. 🎯 실전 퀴즈 1",
                    "15. 🎯 실전 퀴즈 2",
                    "16. 🎯 실전 퀴즈 3",
                    "17. 🎯 실전 퀴즈 4",
                    "18. 🎯 실전 퀴즈 5",
                    "19. 🏆 탐험 완료: 지구 계절 마스터 배지"

                    btn.onclick = () => goToSlide(idx + 1);
                    list.appendChild(btn);
                });

        }

        function renderSlide() {
            updateProgress();
            const body = document.getElementById('slideBody');

                            노르웨이에서는 왜 여름밤에도 해가 지지 않을까요?<br>
                            <span class="text-violet-400 font-bold">지구가 23.5도 기울어진 비밀</span>을 함께 탐험해봐요!

                                <span class="text-xl block mb-1">🌙</span> 백야현상
                            </div>
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-slate-300">
                                <span class="text-xl block mb-1">❄️</span> 극지방의 비밀
                            </div>
                        </div>
                        <button onclick="nextSlide()" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-400 hover:to-fuchsia-400 text-slate-950 font-kids text-lg shadow-xl shadow-violet-900/40 transition-transform active:scale-95 inline-flex items-center gap-2">

                            </div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-4 bg-slate-900/90 rounded-3xl border border-slate-800">
                            <svg viewBox="0 0 220 220" class="w-52 h-52">
                                <defs>
                                    <linearGradient id="dayNight" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#0b132b"/>
                                        <stop offset="48%" stop-color="#0b132b"/>
                                        <stop offset="52%" stop-color="#f59e0b"/>
                                        <stop offset="100%" stop-color="#fbbf24"/>
                                    </linearGradient>
                                </defs>
                                <circle cx="110" cy="110" r="85" fill="url(#dayNight)" stroke="#334155" stroke-width="2"/>
                                <circle cx="110" cy="110" r="85" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
                                <ellipse cx="110" cy="48" rx="70" ry="16" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5,4"/>
                                <text x="60" y="30" fill="#fbbf24" font-size="11" font-weight="bold">북극권</text>

                            <p class="text-[11px] text-slate-400 mt-3 font-kids text-center">
                                점선 원 = 북극권. 여름에는 거의 전체가<br>햇빛 쪼이는 쪽(노란 영역) 안에 머물러요!
                            </p>
                        </div>
                    </div>
                `;
            }

            else if (currentSlide === 11) {
                body.innerHTML = `
                    <div class="grid md:grid-cols-2 gap-8 items-center">
                        <div>
                            <span class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">주제 3 · 극지방</span>
                            <h3 class="font-kids text-2xl md:text-3xl text-white mt-3 mb-4">
                                극지방은 <span class="text-indigo-400">6개월은 낮,</span><br>
                                <span class="text-indigo-300">6개월은 밤</span>이 계속돼요! ❄️

                            <div class="relative w-full h-48 rounded-2xl overflow-hidden">
                                <img src="https://images.unsplash.com/photo-1551415923-31d2072bc248?auto=format&fit=crop&w=800&q=80" onerror="this.src='https://images.unsplash.com/photo-1486566584569-b9319dc74315?auto=format&fit=crop&w=800&q=80'" alt="남극의 얼음 풍경" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-transparent"></div>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-3 font-kids text-center">

                            </p>
                        </div>
                    </div>
                `;
            }

            else if (currentSlide === 12) {
                body.innerHTML = `
                    <div class="text-center">
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">주제 3 · 원리</span>
                        <h3 class="font-kids text-2xl md:text-3xl text-white mt-3 mb-5">
                            극지방에서 극야·백야가 생기는 이유 📐
                        </h3>
                        <div class="grid md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                            <div class="p-4 bg-slate-900/90 rounded-2xl border border-amber-500/30">
                                <div class="text-xs font-kids text-amber-400 mb-2">☀️ 북극이 태양 쪽으로 기울 때</div>
                                <svg viewBox="0 0 200 120" class="w-full h-28">
                                    <circle cx="100" cy="60" r="45" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                                    <circle cx="100" cy="20" r="5" fill="#fbbf24"/>
                                    <line x1="170" y1="60" x2="60" y2="60" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
                                    <text x="140" y="55" fill="#fbbf24" font-size="10">☀️ 태양</text>
                                </svg>
                                <p class="text-[11px] text-slate-400 mt-1">북극(노란 점)이 계속 햇빛 쪽 → 백야</p>
                            </div>
                            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-600">
                                <div class="text-xs font-kids text-slate-300 mb-2">🌑 북극이 태양 반대로 기울 때</div>
                                <svg viewBox="0 0 200 120" class="w-full h-28">
                                    <circle cx="100" cy="60" r="45" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                                    <circle cx="100" cy="20" r="5" fill="#64748b"/>
                                    <line x1="170" y1="60" x2="60" y2="60" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
                                    <text x="140" y="55" fill="#fbbf24" font-size="10">☀️ 태양</text>
                                </svg>
                                <p class="text-[11px] text-slate-400 mt-1">북극(회색 점)이 계속 반대쪽 → 극야</p>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400 mt-4 max-w-lg mx-auto">
                            지구가 자전(하루 1바퀴)해도 극점은 계속 같은 쪽(햇빛 or 그늘)에 머물러서, 몇 달씩 낮이나 밤이 이어지는 거예요!
                        </p>
                    </div>
                `;
            }

            else if (currentSlide === 13) {
                body.innerHTML = `
                    <div class="text-center max-w-2xl mx-auto py-2">
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30">전체 핵심 정리</span>
                        <h3 class="font-kids text-2xl md:text-3xl text-white mt-3 mb-4">
                            오늘 배운 3가지를 꼭 기억해요! 🌟
                        </h3>
                        <div class="grid md:grid-cols-3 gap-3 text-left mb-6">
                            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800">
                                <div class="text-2xl mb-2">📐</div>
                                <h4 class="font-kids text-sm text-violet-400 mb-1">1. 기울어진 지구</h4>
                                <p class="text-xs text-slate-400">지구 자전축은 23.5도 기울어진 채 항상 같은 방향을 가리키며 태양을 돌아요.</p>
                            </div>
                            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800">
                                <div class="text-2xl mb-2">⏰</div>
                                <h4 class="font-kids text-sm text-amber-400 mb-1">2. 계절과 낮밤 길이</h4>
                                <p class="text-xs text-slate-400">이 기울기 때문에 사계절이 생기고, 여름엔 낮이, 겨울엔 밤이 길어져요. 적도는 거의 변화 없어요.</p>
                            </div>
                            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800">
                                <div class="text-2xl mb-2">🌙</div>
                                <h4 class="font-kids text-sm text-sky-400 mb-1">3. 백야와 극야</h4>
                                <p class="text-xs text-slate-400">고위도·극지방에서는 기울기 효과가 극대화되어 몇 달씩 낮 또는 밤이 계속돼요.</p>
                            </div>
                        </div>
                        <div class="p-4 bg-gradient-to-r from-violet-950/40 to-fuchsia-950/40 border border-violet-500/30 rounded-2xl inline-block text-xs font-kids text-violet-300">
                            이제 배운 내용을 복습하는 5문제 퀴즈를 풀어볼까요? 🎯
                        </div>
                    </div>
                `;
            }

            else if (currentSlide >= 14 && currentSlide <= 18) {
                renderQuizSlide(currentSlide - 14);
            }

            else if (currentSlide === 19) {
                renderCompletionSlide();
            }
        }

        function renderQuizSlide(qIndex) {
            const body = document.getElementById('slideBody');
            const q = quizState.questions[qIndex];
            const chosen = quizState.answers[qIndex];

            body.innerHTML = `
                <div class="max-w-xl mx-auto text-center py-2">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30 text-xs font-bold mb-3">
                        <span>🎯 실전 퀴즈 ${qIndex + 1} / 5</span>
                    </div>
                    <h3 class="font-kids text-xl md:text-2xl text-white mb-5 leading-relaxed">
                        ${q.q}
                    </h3>
                    <div class="grid grid-cols-1 gap-3 max-w-md mx-auto" id="quizOptions">
                        ${q.options.map((opt, i) => {
                            let btnClass = "bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700";
                            if (chosen !== undefined) {
                                if (i === q.correct) {
                                    btnClass = "bg-emerald-600 text-white border-emerald-400 ring-2 ring-emerald-400 font-bold";
                                } else if (i === chosen) {
                                    btnClass = "bg-rose-600 text-white border-rose-400 ring-2 ring-rose-400 line-through opacity-70";
                                } else {
                                    btnClass = "bg-slate-900/50 text-slate-500 border-slate-800 pointer-events-none";
                                }
                            }
                            return `
                                <button onclick="selectQuizAnswer(${qIndex}, ${i})" class="p-3.5 rounded-2xl font-kids text-sm text-left transition-all active:scale-95 ${btnClass}">
                                    ${String.fromCharCode(65 + i)}. ${opt}
                                </button>
                            `;
                        }).join('')}
                    </div>
                    <div class="min-h-[60px] mt-4 flex items-center justify-center">
                        ${chosen !== undefined ? `
                            <div class="w-full p-3 rounded-xl ${chosen === q.correct ? 'bg-emerald-950/60 border border-emerald-500/40 text-emerald-300' : 'bg-rose-950/60 border border-rose-500/40 text-rose-300'} text-xs font-kids animate-pop flex items-start gap-2 text-left">
                                <span class="text-lg flex-shrink-0">${chosen === q.correct ? '🎉' : '💡'}</span>
                                <span>${q.explain}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function selectQuizAnswer(qIndex, optIndex) {
            if (quizState.answers[qIndex] !== undefined) return;
            quizState.answers[qIndex] = optIndex;
            const q = quizState.questions[qIndex];
            if (optIndex === q.correct) {
                playSound('correct');
                quizState.score++;
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        function renderCompletionSlide() {
            playSound('fanfare');
            if (window.confetti) {
                window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
            const body = document.getElementById('slideBody');
            body.innerHTML = `
                <div class="text-center max-w-xl mx-auto py-2">
                    <div class="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-tr from-violet-500 via-fuchsia-400 to-amber-400 flex items-center justify-center text-5xl shadow-2xl mb-4 border-2 border-white/20 animate-pop">
                        🏆
                    </div>
                    <span class="px-4 py-1 rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30 text-xs font-bold font-kids">
                        수료증 수여
                    </span>
                    <h3 class="font-kids text-3xl md:text-4xl text-white mt-2 mb-2">
                        축하합니다! 은찬이는 이제<br>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 via-fuchsia-300 to-amber-400">지구 계절 탐험 마스터</span>예요! 🌟
                    </h3>
                    <p class="text-slate-300 text-xs md:text-sm mb-6 leading-relaxed">
                        23.5도 기울어진 지구의 비밀부터 계절과 낮밤 길이, 백야현상과 극지방의 극단적인 낮과 밤까지 모두 정복했어요!
                    </p>

                    <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 max-w-md mx-auto mb-6 text-left">
                        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
                            <span class="text-xs text-slate-400">최종 퀴즈 점수</span>
                            <span class="font-kids text-xl text-violet-400">맞춘 문제: ${quizState.score} / 5</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-xs font-kids">
                            <div class="p-3 bg-slate-950 rounded-2xl text-slate-300">
                                🌟 획득 칭호: <span class="text-amber-400">지구과학 박사</span>
                            </div>
                            <div class="p-3 bg-slate-950 rounded-2xl text-slate-300">
                                🎖️ 완료 배지: <span class="text-violet-400">계절 마스터</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                        <button onclick="restartExperience()" class="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-kids text-sm flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-rotate-left"></i> 처음부터 다시 보기
                        </button>
                        <a href="eunchan-study.html" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-400 hover:to-fuchsia-400 text-slate-950 font-kids text-sm shadow-xl shadow-violet-900/40 flex items-center justify-center gap-2 transition">
                            🎒 공부방 홈으로 가기 <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            `;
        }

        function restartExperience() {
            quizState.answers = {};
            quizState.score = 0;
            initQuiz();
            currentSlide = 1;
            renderSlide();
        }

        // Text-to-Speech (TTS)
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저는 음성 읽어주기를 지원하지 않습니다.');
                return;
            }
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-violet-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[📐🪐☀️⛄🌙❄️✅🎯🏆🚀📊🌐🔗🌟🎖️💡👉🇳🇴🧊🏖️🌇🌆]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-violet-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-violet-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe Navigation
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('button, a, input, select, textarea, .no-swipe')) return;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        renderSlide();
    </script>
</body>
</html>
