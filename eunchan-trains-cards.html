    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'horn') {
                // Dual chord train horn
                [349.23, 440].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(f, now);
                    g.gain.setValueAtTime(0.15, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                    o.start(now);
                    o.stop(now + 0.7);
                });
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

        function updateProgress() {
            document.getElementById('slideIndicator').textContent = currentSlide;
            const pct = (currentSlide / totalSlides) * 100;
            document.getElementById('topProgressBar').style.width = pct + '%';
            document.getElementById('prevBtn').disabled = (currentSlide === 1);
            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);

            const dotsCont = document.getElementById('dotsContainer');
            dotsCont.innerHTML = '';
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all flex-shrink-0 ${i === currentSlide ? 'w-5 bg-sky-400' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(i);
                dotsCont.appendChild(dot);
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                playSound('pop');
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                playSound('pop');
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(n) {
            playSound('pop');
            currentSlide = n;
            renderSlide();
            const drawer = document.getElementById('indexDrawer');
            if (!drawer.classList.contains('hidden')) drawer.classList.add('hidden');
        }

                    btn.onclick = () => goToSlide(idx + 1);
                    list.appendChild(btn);
                });
            }
        }

            } else if (currentSlide >= 19 && currentSlide <= 23) {
                // Quiz
                const qIdx = currentSlide - 19;
                const q = QUIZ_QUESTIONS[qIdx];
                const selected = quizAnswers[qIdx];
                body.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-sky-400 font-kids">🎯 기차 탐험 퀴즈 (${qIdx + 1} / 5)</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-sky-500/20 text-sky-300 font-kids">점수: ${Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length * 20}점</span>
                        </div>
                        <h3 class="font-kids text-xl md:text-2xl text-white mb-4 leading-snug">
                            Q${qIdx + 1}. ${q.q}
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${q.options.map((opt, optIdx) => {
                                let style = "bg-slate-800/90 border-slate-700 hover:bg-slate-700 text-slate-200";
                                if (selected !== undefined) {
                                    if (optIdx === q.ans) style = "bg-emerald-600/90 border-emerald-400 text-white font-bold ring-2 ring-emerald-400";
                                    else if (optIdx === selected) style = "bg-rose-600/90 border-rose-400 text-white font-bold";
                                }
                                return `
                                    <button onclick="handleQuizAnswer(${qIdx}, ${optIdx})" class="p-4 rounded-2xl border text-left font-kids text-sm transition ${style}">
                                        ${optIdx + 1}. ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-xs text-slate-400 font-kids">
                            💡 힌트: ${q.hint}
                        </div>
                    </div>
                `;
            } else if (currentSlide === 24) {
                // Master Badge
                const correctCount = Object.values(quizAnswers).filter((a, i) => a === QUIZ_QUESTIONS[i].ans).length;
                const score = correctCount * 20;
                playSound('fanfare');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                }
                body.innerHTML = `
                    <div class="text-center py-4">
                        <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-sky-500 to-blue-600 shadow-[0_0_35px_rgba(2,132,199,0.5)] flex items-center justify-center text-4xl mb-3">
                            🏆
                        </div>
                        <span class="text-xs font-bold text-sky-400 font-kids tracking-widest uppercase">Railway Master Certificate</span>
                        <h3 class="font-kids text-3xl md:text-4xl text-white mt-1 mb-2">
                            은찬이의 고속기차 탐험 수료를 축하합니다! 🎉
                        </h3>
                        <p class="text-slate-300 text-xs md:text-sm mb-4 font-sans">
                            KTX-청룡부터 신칸센, TGV, 그리고 자기부상열차의 비밀까지 완벽하게 정복했어요!
                        </p>
                        <div class="inline-flex items-center gap-4 p-4 rounded-2xl bg-sky-950/40 border border-sky-500/30 text-center mb-6">
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">퀴즈 성적</span>
                                <span class="font-kids text-2xl text-sky-300">${score}점</span>
                            </div>
                            <div class="w-px h-8 bg-sky-500/30"></div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-kids block">수여 칭호</span>
                                <span class="font-kids text-lg text-amber-300">세계 초고속 열차 명예 수석 기관사 🚅</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-3 font-kids text-xs">
                            <a href="eunchan-study.html" class="px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white transition shadow-lg shadow-sky-950">
                                🎒 은찬이의 공부방 홈으로 이동
                            </a>
                            <button onclick="goToSlide(1)" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                                🔄 처음부터 다시 탐험하기
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function handleQuizAnswer(qIdx, optIdx) {
            if (quizAnswers[qIdx] !== undefined) return;
            quizAnswers[qIdx] = optIdx;
            if (optIdx === QUIZ_QUESTIONS[qIdx].ans) {
                playSound('correct');
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        // Maglev Levitation Canvas
        let isMaglevFloating = true;
        function setMaglevLevitate(val) {
            isMaglevFloating = val;
            drawMaglev(val);
        }

        function drawMaglev(floating) {
            const canvas = document.getElementById('maglevCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const railY = h - 50;

            // Track / Rail
            ctx.fillStyle = '#334155';
            ctx.fillRect(40, railY, w - 80, 20);

            // Track Magnets (S pole on top)
            for (let x = 60; x < w - 80; x += 55) {
                ctx.fillStyle = '#3b82f6'; // Blue S
                ctx.fillRect(x, railY - 12, 40, 12);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('S극', x + 20, railY - 3);
            }

            // Train position
            const floatGap = floating ? 28 : 2;
            const trainY = railY - 12 - floatGap - 45;

            // Train body
            ctx.fillStyle = '#8b5cf6';
            ctx.beginPath();
            ctx.roundRect(80, trainY, w - 160, 45, 12);
            ctx.fill();

            // Train windows
            ctx.fillStyle = '#38bdf8';
            for (let wx = 120; wx < w - 160; wx += 50) {
                ctx.fillRect(wx, trainY + 10, 30, 16);
            }

            // Train Magnets on bottom (S pole facing down -> Repulsion!)
            for (let x = 100; x < w - 160; x += 55) {
                ctx.fillStyle = '#60a5fa'; // S pole
                ctx.fillRect(x, trainY + 45, 40, 12);
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('S극', x + 20, trainY + 54);
            }

            // Levitation arrows / glow
            if (floating) {
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('↑ 자기력 척력(밀어내는 힘)으로 붕 뜸! ↑', w / 2, railY - 18);
            } else {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('레일에 닿음', w / 2, railY - 6);
            }
        }

        // Speed Race Simulator
        const RACERS = [
            { name: "사람 전력질주", speed: 30, color: "#94a3b8", icon: "🏃" },
            { name: "고속도로 자동차", speed: 100, color: "#38bdf8", icon: "🚗" },
            { name: "KTX-청룡", speed: 320, color: "#0284c7", icon: "🚅" },
            { name: "상하이 자기부상", speed: 431, color: "#8b5cf6", icon: "🧲" },
            { name: "TGV 최고기록", speed: 574, color: "#e11d48", icon: "⚡" },
            { name: "L0계 리니어", speed: 603, color: "#10b981", icon: "🚀" }
        ];
        let racerPositions = [0, 0, 0, 0, 0, 0];
        let isRacing = false;

        function initSpeedRace() {
            racerPositions = [0, 0, 0, 0, 0, 0];
            drawRaceFrame();
        }

        function startSpeedRace() {
            if (isRacing) return;
            isRacing = true;
            racerPositions = [0, 0, 0, 0, 0, 0];
            playSound('horn');

            function step() {
                let finished = false;
                const canvas = document.getElementById('raceCanvas');
                if (!canvas) {
                    isRacing = false;
                    return;
                }
                const maxDist = canvas.width - 130;

                for (let i = 0; i < RACERS.length; i++) {
                    const stepInc = (RACERS[i].speed / 603) * 4.5;
                    racerPositions[i] += stepInc;
                    if (racerPositions[i] >= maxDist) {
                        racerPositions[i] = maxDist;
                        finished = true;
                    }
                }
                drawRaceFrame();

                if (!finished) {
                    raceAnimId = requestAnimationFrame(step);
                } else {
                    isRacing = false;
                    playSound('fanfare');
                }
            }
            step();
        }

        function drawRaceFrame() {
            const canvas = document.getElementById('raceCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const rowH = h / 6;
            const startX = 100;
            const finishX = w - 30;

            // Finish line
            ctx.beginPath();
            ctx.moveTo(finishX, 0);
            ctx.lineTo(finishX, h);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            RACERS.forEach((r, i) => {
                const y = i * rowH + rowH / 2;

                // Track lane
                ctx.beginPath();
                ctx.moveTo(startX, y + 10);
                ctx.lineTo(finishX, y + 10);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Name label
                ctx.font = 'bold 10px sans-serif';
                ctx.fillStyle = r.color;
                ctx.textAlign = 'left';
                ctx.fillText(r.name, 10, y + 4);

                // Speed
                ctx.font = '9px sans-serif';
                ctx.fillStyle = '#64748b';
                ctx.fillText(`${r.speed}km/h`, 10, y + 15);

                // Vehicle figure
                const posX = startX + racerPositions[i];
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(r.icon, posX, y + 5);
            });
        }

        // TTS Read Aloud
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다.");
                return;
            }

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-sky-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[🚅⏱️🇰🇷🚆🇯🇵🦆🇫🇷🇩🇪🇹🇼🧲🏁🇨🇳🚀⚡🛡️💺🌟🗺️🎯🏆💡Q\d\.]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-sky-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-sky-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('canvas, button, a, input, select, textarea')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive) {
                touchStartedOnInteractive = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });

        // Init
        renderSlide();
    </script>
</body>
</html>
