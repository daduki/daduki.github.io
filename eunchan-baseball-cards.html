    <!-- Audio FX Synthesizer -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

center py-6\">\n    <div class=\"inline-block p-4 rounded-full bg-amber-500/20 border-4 border-amber-500/50 mb-4\">\n        <span class=\"text-6xl ball-bounce block\">🏆</span>\n    </div>\n    <h2 class=\"font-kids text-3xl md:text-5xl text-amber-400 mb-2\">야구 마스터 수료증</h2>\n    <p class=\"text-white font-sans text-sm md:text-base mb-6\">은찬, 이제 훌륭한 꼬마 야구 전문가가 되었어요!</p>\n    \n    <div class=\"max-w-md mx-auto p-6 bg-[url('images/paper-texture.jpg')] bg-amber-50 rounded-lg border-8 border-double border-amber-700 shadow-2xl relative overflow-hidden text-slate-800 font-sans transform rotate-1\">\n        <div class=\"absolute top-0 right-0 w-16 h-16 bg-red-600 flex items-center justify-center transform rotate-45 translate-x-8 -translate-y-8\">\n            <span class=\"text-white text-xs font-bold mt-4\">KBO</span>\n        </div>\n        <h3 class=\"font-kids text-2xl text-slate-800 border-b-2 border-slate-300 pb-2 mb-4\">수 료 증</h3>\n        <p class=\"text-sm mb-4\">성명: <strong>조은찬</strong> (LG 트윈스 명예선수)</p>\n        <p class=\"text-xs leading-relaxed mb-6\">\n            위 어린이는 신나는 야구의 세계에서<br>\n            스트라이크, 볼넷, 각 포지션의 역할까지 훌륭하게 학습하였으므로<br>\n            이 수료증을 수여합니다!\n        </p>\n        <p class=\"text-xs text-slate-500\">2026년 가을 야구 시즌</p>\n        <div class=\"mt-4 pt-4 border-t border-slate-300\">\n            <p class=\"font-kids text-sm text-red-700\">⚾ 은찬이의 공부방 야구 교실</p>\n        </div>\n    </div>\n\n    <div class=\"mt-6 flex justify-center gap-4\">\n        <button onclick=\"confetti({particleCount: 200, spread: 90, zIndex: 100}); playSound('fanfare');\" class=\"px-6 py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-kids text-sm shadow-xl transition active:scale-95\">\n            🎉 축하 폭죽 터뜨리기\n        </button>\n        <a href=\"eunchan-study.html\" class=\"px-6 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-kids text-sm shadow-xl transition\">\n            🏠 공부방 홈으로 가기\n        </a>\n    </div>\n</div>\n"];

function updateProgress() {
    document.getElementById('slideIndicator').textContent = currentSlide;
    const pct = (currentSlide / totalSlides) * 100;
    document.getElementById('topProgressBar').style.width = pct + '%';
    document.getElementById('prevBtn').disabled = (currentSlide === 1);
    document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);

    const dotsCont = document.getElementById('dotsContainer');
    dotsCont.innerHTML = '';
    for (let i = 1; i <= totalSlides; i++) {
        const dot = document.createElement('button');
        dot.className = `w-2 h-2 rounded-full transition-all flex-shrink-0 ${i === currentSlide ? 'w-5 bg-rose-400' : 'bg-slate-700 hover:bg-slate-500'}`;
        dot.onclick = () => goToSlide(i);
        dotsCont.appendChild(dot);
    }
}

function nextSlide() {
    if (currentSlide < totalSlides) {
        playSound('pop');
        currentSlide++;
        renderSlide();
    }
}

function prevSlide() {
    if (currentSlide > 1) {
        playSound('pop');
        currentSlide--;
        renderSlide();
    }
}

function goToSlide(n) {
    playSound('pop');
    currentSlide = n;
    renderSlide();
    const drawer = document.getElementById('indexDrawer');
    if (!drawer.classList.contains('hidden')) drawer.classList.add('hidden');
}

function toggleIndexDrawer() {
    const drawer = document.getElementById('indexDrawer');
    drawer.classList.toggle('hidden');
    if (!drawer.classList.contains('hidden')) {
        const list = document.getElementById('drawerList');
        list.innerHTML = '';
        SLIDE_TITLES.forEach((t, idx) => {
            const btn = document.createElement('button');
            btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between transition ${idx + 1 === currentSlide ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
            btn.textContent = t;
            btn.onclick = () => goToSlide(idx + 1);
            list.appendChild(btn);
        });
    }
}

function renderSlide() {
    updateProgress();
    const body = document.getElementById('slideBody');
    body.innerHTML = slideHTML[currentSlide - 1];
}

// Initialize
window.onload = () => {
    renderSlide();
};
