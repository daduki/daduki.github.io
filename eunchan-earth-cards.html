    <!-- Audio FX Synthesizer Script -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                // Happy high double chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                // Gentle bonk sound
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                // Page flip pop
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'fanfare') {
                // Celebration fanfare
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.18, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.4);
                });
            }
        }
    </script>

        // Initialize Quiz 2 random 5 questions from the 10 countries
        function initQuiz2() {
            const pool = [...COUNTRY_DATA.slice(0, 10)];
            // Fisher-Yates shuffle
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            quiz2State.questions = pool.slice(0, 5).map(c => {
                // Pick 3 distractors
                const others = COUNTRY_DATA.filter(o => o.nameKo !== c.nameKo);
                const shuffledOthers = others.sort(() => 0.5 - Math.random()).slice(0, 3);
                const options = [c, ...shuffledOthers].sort(() => 0.5 - Math.random());
                return {
                    country: c,
                    options: options,
                    clue: c.clues[Math.floor(Math.random() * c.clues.length)]
                };
            });

            for (let i = 1; i <= totalSlides; i++) {

                dotsCont.appendChild(dot);
            }

        // Global interaction flag to prevent swipe navigation while dragging maps
        let isInteractingWithMap = false;
        let touchStartedOnInteractive = false;

        // D3 Canvas Globe Renderer
        function drawGlobe(canvas, targetId, centerLonLat, scaleMultiplier = 1.0, interactive = true) {
            if (!worldFeatures) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const radius = Math.min(width, height) / 2 - 14;

            let rotation = [-centerLonLat[0], -centerLonLat[1], 0];
            const projection = d3.geoOrthographic()
                .scale(radius * scaleMultiplier)
                .translate([width / 2, height / 2])
                .rotate(rotation)
                .clipAngle(90);

            const path = d3.geoPath().projection(projection).context(ctx);

            function render() {
                ctx.clearRect(0, 0, width, height);

                // Ocean background circle with radial glow
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, radius, 0, 2 * Math.PI);
                const grad = ctx.createRadialGradient(width / 2 - radius * 0.3, height / 2 - radius * 0.3, radius * 0.1, width / 2, height / 2, radius);
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#09111e');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#38bdf8';
                ctx.stroke();

                // Graticules (Latitude & Longitude grid)
                const graticule = d3.geoGraticule10();
                ctx.beginPath();
                path(graticule);
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.18)';
                ctx.stroke();

                // All continents
                worldFeatures.features.forEach(f => {
                    ctx.beginPath();
                    path(f);
                    if (targetId && (f.id === targetId || (Array.isArray(targetId) && targetId.includes(f.id)))) {
                        ctx.fillStyle = '#10b981'; // Glowing Emerald
                    } else {
                        ctx.fillStyle = '#334155'; // Slate land
                    }
                    ctx.fill();
                    ctx.lineWidth = 0.6;
                    ctx.strokeStyle = '#1e293b';
                    ctx.stroke();
                });

                // Target highlight border
                if (targetId) {
                    worldFeatures.features.forEach(f => {
                        if (f.id === targetId || (Array.isArray(targetId) && targetId.includes(f.id))) {
                            ctx.beginPath();
                            path(f);
                            ctx.lineWidth = 2.5;
                            ctx.strokeStyle = '#34d399';
                            ctx.stroke();
                        }
                    });
                }

                // Atmosphere rim shadow
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, radius, 0, 2 * Math.PI);
                const rimGrad = ctx.createRadialGradient(width / 2, height / 2, radius * 0.75, width / 2, height / 2, radius);
                rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
                rimGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
                ctx.fillStyle = rimGrad;
                ctx.fill();
            }

            render();

            if (interactive) {
                canvas.style.touchAction = 'none';
                canvas.style.cursor = 'grab';
                let dragging = false;
                let lastPos = [0, 0];
                function onPointerDown(e) {
                    dragging = true;
                    isInteractingWithMap = true;
                    touchStartedOnInteractive = true;
                    canvas.style.cursor = 'grabbing';
                    lastPos = [e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY)];
                    if (e.cancelable) e.preventDefault();
                    e.stopPropagation();
                }
                function onPointerMove(e) {
                    if (!dragging) return;
                    isInteractingWithMap = true;
                    const x = e.clientX || (e.touches && e.touches[0].clientX);
                    const y = e.clientY || (e.touches && e.touches[0].clientY);
                    const dx = x - lastPos[0];
                    const dy = y - lastPos[1];
                    lastPos = [x, y];
                    rotation[0] += dx * 0.4;
                    rotation[1] = Math.max(-80, Math.min(80, rotation[1] - dy * 0.4));
                    projection.rotate(rotation);
                    render();
                    if (e.cancelable) e.preventDefault();
                }
                function onPointerUp() {
                    dragging = false;
                    canvas.style.cursor = 'grab';
                    setTimeout(() => { isInteractingWithMap = false; }, 120);
                }

                if (!canvas._hasGlobeDragListeners) {
                    canvas._hasGlobeDragListeners = true;
                    canvas.addEventListener('mousedown', onPointerDown);
                    window.addEventListener('mousemove', onPointerMove);
                    window.addEventListener('mouseup', onPointerUp);
                    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
                    window.addEventListener('touchmove', onPointerMove, { passive: false });
                    window.addEventListener('touchend', onPointerUp);
                }
            }
        }

        // D3 Canvas Mercator Map Renderer (Supports Horizontal Dragging)
        function drawMercator(canvas, targetId, highlightLat = null) {
            if (!worldFeatures) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            if (canvas._rotLon === undefined) {
                canvas._rotLon = 0;
            }

            const projection = d3.geoMercator()
                .scale(width / (2 * Math.PI) * 0.95)
                .translate([width / 2, height / 2 + 18])
                .rotate([canvas._rotLon, 0]);

            const path = d3.geoPath().projection(projection).context(ctx);

            ctx.clearRect(0, 0, width, height);

            // Ocean background
            ctx.fillStyle = '#09111e';
            ctx.fillRect(0, 0, width, height);

            // Graticules
            ctx.beginPath();
            path(d3.geoGraticule10());
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
            ctx.stroke();

            // Equator line highlight
            const equator = d3.geoCircle().center([0, 90]).radius(90)();
            ctx.beginPath();
            path(equator);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
            ctx.stroke();

            // Land
            worldFeatures.features.forEach(f => {
                ctx.beginPath();
                path(f);
                if (targetId && (f.id === targetId || (Array.isArray(targetId) && targetId.includes(f.id)))) {
                    ctx.fillStyle = '#38bdf8'; // Flat map highlight
                } else {
                    ctx.fillStyle = '#1e293b';
                }
                ctx.fill();
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = '#334155';
                ctx.stroke();
            });

            if (targetId) {
                worldFeatures.features.forEach(f => {
                    if (f.id === targetId || (Array.isArray(targetId) && targetId.includes(f.id))) {
                        ctx.beginPath();
                        path(f);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#7dd3fc';
                        ctx.stroke();
                    }
                });
            }

            // Latitude distortion label
            if (highlightLat !== null) {
                ctx.fillStyle = '#f43f5e';
                ctx.font = '10px sans-serif';
                ctx.fillText('적도 (왜곡 없음: 1배)', 6, height / 2 + 14);
            }

            // Interactive horizontal drag on 2D Mercator
            if (!canvas._hasMercatorDragListeners) {
                canvas._hasMercatorDragListeners = true;
                canvas.style.touchAction = 'none';
                canvas.style.cursor = 'grab';
                let mDragging = false;
                let mStartX = 0;

                function onMDown(e) {
                    mDragging = true;
                    isInteractingWithMap = true;
                    touchStartedOnInteractive = true;
                    canvas.style.cursor = 'grabbing';
                    mStartX = e.clientX || (e.touches && e.touches[0].clientX);
                    if (e.cancelable) e.preventDefault();
                    e.stopPropagation();
                }

                function onMMove(e) {
                    if (!mDragging) return;
                    isInteractingWithMap = true;
                    const x = e.clientX || (e.touches && e.touches[0].clientX);
                    const dx = x - mStartX;
                    mStartX = x;
                    let nextRot = (canvas._rotLon + dx * 0.45) % 360;
                    if (nextRot > 180) nextRot -= 360;
                    if (nextRot < -180) nextRot += 360;
                    canvas._rotLon = nextRot;
                    drawMercator(canvas, targetId, highlightLat);
                    if (e.cancelable) e.preventDefault();
                }

                function onMUp() {
                    mDragging = false;
                    canvas.style.cursor = 'grab';
                    setTimeout(() => { isInteractingWithMap = false; }, 120);
                }

                canvas.addEventListener('mousedown', onMDown);
                window.addEventListener('mousemove', onMMove);
                window.addEventListener('mouseup', onMUp);
                canvas.addEventListener('touchstart', onMDown, { passive: false });
                window.addEventListener('touchmove', onMMove, { passive: false });
                window.addEventListener('touchend', onMUp);
            }
        }

                    <p class="text-slate-300 text-xs md:text-sm mb-6 leading-relaxed">
                        평면 지도의 메르카토르 왜곡 비밀부터 인도 vs 그린란드 진짜 크기,<br>
                        그리고 세계에서 영토가 가장 넓은 나라 Top 10까지 모두 정복했어요!
                    </p>

                    <!-- Score Card -->
                    <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 max-w-md mx-auto mb-6 text-left">
                        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
                            <span class="text-xs text-slate-400">최종 퀴즈 점수</span>
                            <span class="font-kids text-xl text-emerald-400">맞춘 문제: ${quiz2State.score} / 5</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-xs font-kids">
                            <div class="p-3 bg-slate-950 rounded-2xl text-slate-300">
                                🌟 획득 칭호: <span class="text-amber-400">세계 지리 박사</span>
                            </div>
                            <div class="p-3 bg-slate-950 rounded-2xl text-slate-300">
                                🎖️ 완료 배지: <span class="text-emerald-400">3D 지구 마스터</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                        <button onclick="restartExperience()" class="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-kids text-sm flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-rotate-left"></i> 처음부터 다시 보기
                        </button>
                        <a href="eunchan-study.html" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-kids text-sm shadow-xl shadow-emerald-900/40 flex items-center justify-center gap-2 transition">
                            🎒 공부방 홈으로 가기 <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            `;
        }

        function restartExperience() {
            quiz1Answers = { q1: null, q2: null };
            quiz2State.answers = {};
            quiz2State.score = 0;
            initQuiz2();
            currentSlide = 1;
            renderSlide();
        }

        // Text-to-Speech (TTS) for kids
        let isSpeaking = false;
        function toggleReadOutLoud() {
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저는 음성 읽어주기를 지원하지 않습니다.');
                return;
            }
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-emerald-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
                return;
            }

            const slide = document.getElementById('slideBody');
            if (!slide) return;
            const textToRead = slide.innerText.replace(/[⭕❌✨💡🚨🤔👉🔴🌟🎖️🏆🚀🍊🗺️🔍📏🌐❓🇩🇿🇰🇿🇦🇷🇮🇳🇦🇺🇧🇷🇺🇸🇨🇳🇨🇦🇷🇺🇬🇱]/g, ' ');

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95; // slightly slower for kids
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('ttsBtn').classList.remove('text-amber-400');
                document.getElementById('ttsBtn').classList.add('text-emerald-400', 'animate-pulse');
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('ttsBtn').classList.remove('text-emerald-400', 'animate-pulse');
                document.getElementById('ttsBtn').classList.add('text-amber-400');
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Keyboard Navigation (Arrow Keys)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Touch Swipe Navigation for mobile & tablets (prevented during map interactions)
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            if (isInteractingWithMap || e.target.closest('canvas, button, a, input, select, textarea, .no-swipe')) {
                touchStartedOnInteractive = true;
                return;
            }
            touchStartedOnInteractive = false;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (touchStartedOnInteractive || isInteractingWithMap) {
                touchStartedOnInteractive = false;
                isInteractingWithMap = false;
                return;
            }
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 75) nextSlide();
            if (touchEndX - touchStartX > 75) prevSlide();
        }, { passive: true });
    </script>
</body>
</html>
